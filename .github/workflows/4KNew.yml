name: 4K Video RizwanNew
on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'কোন সুরার ভিডিও বানাবে? (যেমন: 001, 002)'
        required: true
        default: '001'
        type: string
      image_folder:
        description: 'Image folder'
        required: false
        default: 'img'
        type: string
      audio_folder:
        description: 'Audio folder'
        required: false
        default: 'rizwanaudio'
        type: string

jobs:
  make-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install Pillow

      - name: Make Ayat Videos and Merge to One Surah Video - 4K
        run: |
          IMG_DIR="${{ inputs.image_folder }}"
          AUDIO_DIR="${{ inputs.audio_folder }}"
          SURAH="${{ inputs.surah_number }}"
          TEMP_IMG_DIR="temp_${SURAH}_images_fixed"
          TEMP_VIDEO_DIR="temp_${SURAH}_videos"
          FINAL_DIR="rizwanSurahVideo"
          TARGET_W=3840
          TARGET_H_MIN=2160

          mkdir -p "$TEMP_IMG_DIR"
          mkdir -p "$TEMP_VIDEO_DIR"
          mkdir -p "$FINAL_DIR"

          python3 << PY
          from PIL import Image
          import os, glob

          IMG_DIR = os.environ.get("IMG_DIR", "${{ inputs.image_folder }}")
          SURAH = os.environ.get("SURAH", "${{ inputs.surah_number }}")
          TEMP_IMG_DIR = os.environ.get("TEMP_IMG_DIR", f"temp_{SURAH}_images_fixed")
          TARGET_W = int(os.environ.get("TARGET_W", "3840"))
          TARGET_H_MIN = int(os.environ.get("TARGET_H_MIN", "2160"))

          def make_canvas_fixed_width(img_path, out_path):
              img = Image.open(img_path).convert("RGB")
              W_orig, H_orig = img.size

              # 1. Width 3840 lock - আগের workflow এর মতো
              if W_orig != TARGET_W:
                  ratio = TARGET_W / W_orig
                  new_h = round(H_orig * ratio)
                  img = img.resize((TARGET_W, new_h), Image.LANCZOS)
                  print(f"[INFO] {os.path.basename(img_path)} width {W_orig} -> {TARGET_W}, height {H_orig}->{new_h}")

              W, H = img.size
              BASE_H = H

              # 2. Height Dynamic - 2160 এর কম হলে নিচের 10px টেনে বাড়ানো
              if H < TARGET_H_MIN:
                  # আগের make_canvas() এর মতো logic
                  canvas = Image.new("RGB", (TARGET_W, TARGET_H_MIN), (232,236,244))
                  canvas.paste(img, (0,0))
                  strip = img.crop((0, BASE_H-10, TARGET_W, BASE_H))
                  canvas.paste(strip.resize((TARGET_W, TARGET_H_MIN - BASE_H), Image.LANCZOS), (0, BASE_H))
                  canvas.save(out_path, "JPEG", quality=95, subsampling=0)
                  print(f"[INFO] Extended height {H} -> {TARGET_H_MIN} for {os.path.basename(img_path)}")
              else:
                  # Height already >= 2160, keep as is (লম্বা আয়াত কাটবে না)
                  # Even height for ffmpeg yuv420p
                  if H % 2 != 0:
                      img = img.resize((TARGET_W, H+1), Image.LANCZOS)
                  img.save(out_path, "JPEG", quality=95, subsampling=0)
                  print(f"[INFO] Kept height {H} for {os.path.basename(img_path)}")

          pattern = os.path.join(IMG_DIR, f"{SURAH}*.jpg")
          for p in sorted(glob.glob(pattern)):
              base = os.path.basename(p)
              out = os.path.join(TEMP_IMG_DIR, base)
              make_canvas_fixed_width(p, out)

          PY

          # 3. Image + Audio to Video
          for img_file in "$TEMP_IMG_DIR"/${SURAH}*.jpg; do
            [ -e "$img_file" ] || continue
            file_name=$(basename "$img_file")
            base="${file_name%.*}"
            audio_file="$AUDIO_DIR/$base.mp3"

            if [ ! -f "$audio_file" ]; then
              echo "Audio missing: $audio_file - Skipping"
              continue
            fi

            echo "Processing: $file_name -> $base.mp4"

            # --- FIXED PART: NO STRETCH ---
            # আগের scale=trunc(iw/2)*2... বাদ দিয়ে শুধু pad দিয়ে even করা হয়েছে, তাই ছবি stretch হবে না
            ffmpeg -y -hide_banner -loglevel error \
              -loop 1 -i "$img_file" \
              -i "$audio_file" \
              -c:v libx264 -tune stillimage -preset medium -crf 18 \
              -vf "setsar=1,fps=30,pad=ceil(iw/2)*2:ceil(ih/2)*2:(ow-iw)/2:(oh-ih)/2:color=black@0" \
              -c:a aac -b:a 192k \
              -pix_fmt yuv420p -shortest \
              "$TEMP_VIDEO_DIR/$base.mp4"
          done

          if ! ls "$TEMP_VIDEO_DIR"/${SURAH}*.mp4 1> /dev/null 2>&1; then
            echo "No videos found to merge for Surah $SURAH"
            exit 1
          fi

          ls -1 "$TEMP_VIDEO_DIR"/${SURAH}*.mp4 | sort -V > video_list_raw.txt

          # --- সবচেয়ে বড় height বের করা (padding এর common target হিসেবে) ---
          MAX_H=0
          while read f; do
            h=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f")
            if [ "$h" -gt "$MAX_H" ]; then
              MAX_H=$h
            fi
          done < video_list_raw.txt
          if [ $((MAX_H % 2)) -ne 0 ]; then
            MAX_H=$((MAX_H + 1))
          fi
          echo "Merge target height: $MAX_H"

          # --- Dynamic ffmpeg inputs + filter_complex তৈরি (stretch ছাড়া pad করে concat) ---
          INPUTS=()
          FILTER=""
          CONCAT_PART=""
          i=0
          while read f; do
            INPUTS+=(-i "$f")
            FILTER+="[$i:v]scale=3840:-2,pad=3840:${MAX_H}:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=30[v$i];"
            CONCAT_PART+="[v$i][$i:a]"
            i=$((i+1))
          done < video_list_raw.txt

          FILTER+="${CONCAT_PART}concat=n=${i}:v=1:a=1[outv][outa]"

          ffmpeg -y -hide_banner -loglevel error \
            "${INPUTS[@]}" \
            -filter_complex "$FILTER" \
            -map "[outv]" -map "[outa]" \
            -c:v libx264 -preset medium -crf 18 \
            -c:a aac -b:a 192k \
            -pix_fmt yuv420p \
            "$FINAL_DIR/${SURAH}.mp4"

          ls -lh "$FINAL_DIR"/
          rm -rf "$TEMP_VIDEO_DIR" "$TEMP_IMG_DIR" video_list_raw.txt

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: Surah-${{ inputs.surah_number }}-4K-Video
          path: rizwanSurahVideo/

      - name: Commit Video to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f rizwanSurahVideo/
          git commit -m "Added Surah ${{ inputs.surah_number }} 4K Video - Fixed Width 3840 Height Dynamic" || echo "No changes"
          git push || echo "Push failed - file >100MB, use Artifact"
