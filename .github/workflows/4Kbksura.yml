name: S2Rizwan Generate Surah Video (All-in-One)

on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'সূরা নম্বর (যেমন: 111)'
        required: true
        type: string
      arabic_name:
        description: 'আরবি সূরার নাম (এখন ছবিতে দেখানো হয় না, তবু রাখা হয়েছে ভবিষ্যতের জন্য)'
        required: false
        default: ''
        type: string
      bangla_name:
        description: 'বাংলা সূরার নাম (পিল ব্যাজে দেখাবে)'
        required: true
        type: string
      background_video:
        description: 'এক বা একাধিক Background video - repo-এর ভেতরের পাথ এবং/অথবা সরাসরি ডাউনলোডযোগ্য URL (http/https), একাধিক হলে কমা (,) দিয়ে আলাদা করুন।'
        required: false
        default: 'src/background.mp4'
        type: string
      audio_folder:
        description: 'Audio folder'
        required: false
        default: 'rizwanaudio'
        type: string
      logo_path:
        description: 'Logo image path (top-right corner-এ বসবে)'
        required: false
        default: 'src/logo.jpg'
        type: string
      target_width:
        description: 'Master (সর্বোচ্চ কোয়ালিটি) video width'
        required: false
        default: '2160'
        type: string
      target_height:
        description: 'Master (সর্বোচ্চ কোয়ালিটি) video height'
        required: false
        default: '3840'
        type: string
      boomerang_background:
        description: 'Background video শেষ হলে আবার প্রথম থেকে না চালিয়ে উল্টো দিকে (রিভার্স) চালানো হবে কিনা - forward → reverse → forward ... (true/false)'
        required: false
        default: 'true'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install Pillow
          sudo apt-get update && sudo apt-get install -y ffmpeg bc

      # ---------------------------------------------------------
      # ধাপ ০: background_video ইনপুট চেক - এক বা একাধিক (কমা দিয়ে আলাদা)
      # পাথ/URL থাকতে পারে। URL হলে ডাউনলোড, লোকাল হলে সরাসরি ব্যবহার।
      # সবগুলোর একটা লিস্ট (bg_list.txt) বানানো হয়, পরের ধাপে merge হবে।
      # ---------------------------------------------------------
      - name: Resolve background video(s) (download if URL, supports multiple)
        id: resolve_bg
        env:
          BG_INPUT: ${{ inputs.background_video }}
        run: |
          set -e
          mkdir -p downloaded
          > bg_list.txt

          IFS=',' read -ra ITEMS <<< "${BG_INPUT:-src/background.mp4}"
          COUNT=0
          for RAW in "${ITEMS[@]}"; do
            ITEM=$(echo "$RAW" | xargs)
            [ -z "$ITEM" ] && continue
            COUNT=$((COUNT+1))

            if [[ "$ITEM" == http://* || "$ITEM" == https://* ]]; then
              echo "Link দেওয়া আছে ($COUNT), ডাউনলোড করা হচ্ছে: $ITEM"
              EXT="${ITEM##*.}"
              case "$EXT" in
                mp4|mov|mkv|webm) OUT_FILE="downloaded/bg_${COUNT}.$EXT" ;;
                *) OUT_FILE="downloaded/bg_${COUNT}.mp4" ;;
              esac

              if curl -L -f --retry 3 --retry-delay 5 -o "$OUT_FILE" "$ITEM" && [ -s "$OUT_FILE" ]; then
                echo "$OUT_FILE" >> bg_list.txt
              else
                echo "Download failed for: $ITEM - skip kora hocche"
              fi
            else
              if [ -f "$ITEM" ]; then
                echo "Local path use kora hocche ($COUNT): $ITEM"
                echo "$ITEM" >> bg_list.txt
              else
                echo "Local file paoa jayni: $ITEM - skip kora hocche"
              fi
            fi
          done

          if [ ! -s bg_list.txt ]; then
            echo "Kono valid background video paoa jayni - default src/background.mp4 use kora hocche"
            echo "src/background.mp4" > bg_list.txt
          fi

          echo "Resolved background video list:"
          cat bg_list.txt

      # ---------------------------------------------------------
      # ধাপ ১: প্রতিটা background ভিডিও normalize করে concat করে একটা
      # একক ব্যাকগ্রাউন্ড ভিডিও বানানো হয় (master resolution-এ)।
      # ---------------------------------------------------------
      - name: Normalize & merge background video(s)
        env:
          TARGET_W: ${{ inputs.target_width }}
          TARGET_H: ${{ inputs.target_height }}
        run: |
          mkdir -p normalized
          > normalize_concat_list.txt

          i=0
          while IFS= read -r BG_VIDEO; do
            i=$((i+1))
            BG_W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$BG_VIDEO")
            BG_H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$BG_VIDEO")
            echo "[$i] $BG_VIDEO -> Original: ${BG_W}x${BG_H} | Target: ${TARGET_W}x${TARGET_H}"

            OUT="normalized/part_${i}.mp4"
            ffmpeg -y -hide_banner -loglevel error \
              -i "$BG_VIDEO" \
              -vf "scale=${TARGET_W}:${TARGET_H}:force_original_aspect_ratio=increase,crop=${TARGET_W}:${TARGET_H},setsar=1,fps=30" \
              -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p \
              -an \
              "$OUT"

            echo "file '$(realpath "$OUT")'" >> normalize_concat_list.txt
          done < bg_list.txt

          echo "Merging $i background video(s) into one..."
          ffmpeg -y -hide_banner -loglevel error \
            -f concat -safe 0 -i normalize_concat_list.txt \
            -c copy \
            normalized/background_normalized.mp4

          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 normalized/background_normalized.mp4

      # ---------------------------------------------------------
      # ধাপ ২ (নতুন): "বুমেরাং" ব্যাকগ্রাউন্ড বানানো - forward + reverse
      # জোড়া লাগিয়ে একটা সেগমেন্ট বানানো হয়। যেহেতু reverse অংশের প্রথম
      # ফ্রেম = forward অংশের শেষ ফ্রেম, এবং reverse অংশের শেষ ফ্রেম =
      # forward অংশের প্রথম ফ্রেম - তাই এই সেগমেন্টটা "-stream_loop -1"
      # দিয়ে বারবার চালালে কোনো ঝাঁকুনি/জাম্প ছাড়াই "সামনে যাচ্ছে, আবার
      # পিছনে যাচ্ছে" - এই প্যাটার্নে অনন্তকাল চলতে থাকবে।
      #
      # boomerang_background input 'false' দিলে পুরনো আচরণ (শুধু normal
      # লুপ, রিভার্স ছাড়া) বহাল থাকবে।
      # ---------------------------------------------------------
      - name: Create boomerang (forward + reverse) background
        env:
          BOOMERANG: ${{ inputs.boomerang_background }}
        run: |
          set -e
          cd normalized

          if [ "$BOOMERANG" = "true" ]; then
            echo "Reverse copy toiri kora hocche (eta pura video RAM-e load kore, boro video hole somoy/memory beshi lagte pare)..."
            ffmpeg -y -hide_banner -loglevel error \
              -i background_normalized.mp4 \
              -vf reverse \
              -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p \
              -an \
              background_reversed.mp4

            echo "file '$(realpath background_normalized.mp4)'" > boomerang_list.txt
            echo "file '$(realpath background_reversed.mp4)'" >> boomerang_list.txt

            ffmpeg -y -hide_banner -loglevel error \
              -f concat -safe 0 -i boomerang_list.txt \
              -c copy \
              background_playback.mp4

            rm -f background_reversed.mp4 boomerang_list.txt
          else
            echo "boomerang_background=false - normal loop babohar hobe (age jemon chilo)"
            cp background_normalized.mp4 background_playback.mp4
          fi

          cd ..
          ffprobe -v error -show_entries format=duration -of csv=p=0 normalized/background_playback.mp4

      # ---------------------------------------------------------
      # ধাপ ৩: শুধু নির্দিষ্ট সূরার আয়াতগুলোর জন্য "অ্যানিমেটেড" (transparent,
      # আলফা-চ্যানেলসহ) ওভারলে ভিডিও ক্লিপ বানানো - PNG এর বদলে এখন প্রতি
      # আয়াতের জন্য একটা .webm ক্লিপ তৈরি হয় যেখানে:
      #   - পিল ব্যাজ + নীল আয়াত-নম্বর ব্যাজ + আরবি বার + লোগো: পুরো কার্ডটা
      #     প্রথম ০.৩ সেকেন্ডে আস্তে ভেসে ওঠে (fade-in), তারপর স্থির থাকে
      #   - বাংলা অনুবাদ বার: টাইপরাইটার এফেক্টে অক্ষর-বাই-অক্ষর টাইপ হতে
      #     থাকে, তারপর বাকি সময় পুরো টেক্সট স্থির দেখা যায়
      #
      # পারফরম্যান্স অপটিমাইজেশন (আগের ভার্সনের তুলনায়):
      #   ১) ফ্রেম সংখ্যা এখন আর "fps x পুরো অডিও দৈর্ঘ্য" দিয়ে ঠিক হয় না -
      #      বরং অনুবাদের অক্ষর সংখ্যা দিয়ে ঠিক হয়। টাইপিং শেষ হওয়ার পর
      #      একটামাত্র "hold" ফ্রেম বানিয়ে ffmpeg concat demuxer-এর
      #      "duration" নির্দেশ দিয়ে বাকি পুরো সময়টা ধরে রাখা হয় - নতুন
      #      করে হাজারো ডুপ্লিকেট ফ্রেম রেন্ডার/এনকোড করতে হয় না।
      #   ২) সবগুলো আয়াত সিরিয়ালি না করে multiprocessing দিয়ে একসাথে
      #      (parallel) প্রসেস করা হয় - রানারের সব CPU core কাজে লাগে।
      #
      # লক্ষ্য করুন: এটা MoviePy দিয়ে নয়, বরং Pillow (ফ্রেম আঁকা) + ffmpeg
      # (VP9/alpha এনকোড) দিয়ে করা হয়েছে - ফলাফল একই (transparent animated
      # video clip), কিন্তু অতিরিক্ত ভারী ডিপেন্ডেন্সি ছাড়াই।
      # ---------------------------------------------------------
      - name: Generate Animated Typewriter Overlays for this Surah
        env:
          BANGLA_NAME: ${{ inputs.bangla_name }}
          SURAH_NUMBER: ${{ inputs.surah_number }}
          LOGO_PATH: ${{ inputs.logo_path }}
          TARGET_W: ${{ inputs.target_width }}
          TARGET_H: ${{ inputs.target_height }}
          AUDIO_DIR: ${{ inputs.audio_folder }}
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json, os, re, subprocess, shutil, multiprocessing

          DATA = "src/data.json"
          OUT_DIR = "overlays_anim"
          FRAMES_ROOT = "overlay_frames_tmp"
          FONT_BN = "src/solaimanlipi.ttf"
          FONT_AR = "src/noorehuda.ttf"

          W = int(os.environ.get("TARGET_W", "2160"))
          H = int(os.environ.get("TARGET_H", "3840"))
          SCALE = W / 1080.0

          SURAH_NUMBER = int(os.environ.get("SURAH_NUMBER", "0"))
          BN_NAME = os.environ.get("BANGLA_NAME", "").strip()
          LOGO_PATH = os.environ.get("LOGO_PATH", "src/logo.jpg").strip()
          AUDIO_DIR = os.environ.get("AUDIO_DIR", "rizwanaudio").strip()

          # টাইপরাইটার স্পিড ও ফেড-ইন সময় - এখানে বদলালেই পুরো সূরা জুড়ে প্রভাব পড়বে
          SECONDS_PER_CHAR = 0.055   # প্রতি অক্ষর টাইপ হতে যত সময় লাগবে (কমালে দ্রুত টাইপ হবে, ফ্রেমও কমবে)
          FADE_IN_SECONDS  = 0.3     # পুরো কার্ড ভেসে ওঠার সময়
          N_FADE_STEPS     = 5       # fade-in এর জন্য কয়টা মাঝের ফ্রেম লাগবে
          MIN_TYPING_TIME  = 0.4

          os.makedirs(OUT_DIR, exist_ok=True)
          if os.path.exists(FRAMES_ROOT):
              shutil.rmtree(FRAMES_ROOT)
          os.makedirs(FRAMES_ROOT, exist_ok=True)

          EN_TO_BN = str.maketrans("0123456789", "০১২৩৪৫৬৭৮৯")
          def to_bangla_num(s): return str(s).translate(EN_TO_BN)

          def extract_number(s):
              s = str(s).translate(str.maketrans("০১২৩৪৫৬৭৮৯", "0123456789"))
              m = re.search(r'\d+', s)
              return int(m.group()) if m else 0

          def normalize_arabic_display(text):
              return text.replace('\u0671', '\u0627')

          def get_font(is_ar, px_size):
              p = FONT_AR if is_ar else FONT_BN
              try:
                  return ImageFont.truetype(p, max(1, int(px_size)))
              except Exception:
                  return ImageFont.load_default()

          def wrap_text(draw, text, font, max_w):
              lines, cur = [], ""
              for w in text.split():
                  test = f"{cur} {w}".strip()
                  if draw.textlength(test, font=font) <= max_w:
                      cur = test
                  else:
                      if cur:
                          lines.append(cur)
                      cur = w
              if cur:
                  lines.append(cur)
              return lines

          def draw_centered(draw, cx, y, text, font, fill):
              if not text:
                  return
              w = draw.textlength(text, font=font)
              draw.text((cx - w / 2, y), text, font=font, fill=fill)

          def revealed_lines(lines, revealed_chars):
              out, remaining = [], revealed_chars
              for line in lines:
                  if remaining <= 0:
                      out.append("")
                  elif remaining >= len(line):
                      out.append(line)
                      remaining -= len(line)
                  else:
                      out.append(line[:remaining])
                      remaining = 0
              return out

          def audio_duration(path):
              try:
                  out = subprocess.check_output([
                      "ffprobe", "-v", "error", "-show_entries", "format=duration",
                      "-of", "csv=p=0", path
                  ])
                  return max(0.3, float(out.strip()))
              except Exception as e:
                  print(f"Duration probe failed for {path}: {e}")
                  return 3.0

          # ---------- style constants (আগের static overlay-র মতোই) ----------
          SIDE_MARGIN     = int(50 * SCALE)
          MAX_TEXT_W      = W - 2 * SIDE_MARGIN
          BOTTOM_MARGIN   = int(90 * SCALE)
          TOP_LIMIT       = int(H * 0.30)
          MAX_BLOCK_RATIO = 0.60

          PILL_BG    = (255, 255, 255, 235)
          PILL_TEXT  = (25, 25, 35, 255)
          BADGE_BG   = (32, 92, 210, 255)
          BADGE_TEXT = (255, 255, 255, 255)
          BAR_BG     = (12, 14, 26, 175)
          WHITE      = (255, 255, 255, 255)
          GOLD       = (255, 224, 130, 255)

          BASE_PILL_FONT  = 34
          BASE_BADGE_FONT = 38
          BASE_AR_FONT    = 58
          BASE_LABEL_FONT = 28
          BASE_BN_FONT    = 40
          FONT_FLOOR      = 22
          GAP             = int(26 * SCALE)
          BAR_PAD_X       = int(34 * SCALE)
          BAR_PAD_Y       = int(22 * SCALE)
          BADGE_PAD_X     = int(26 * SCALE)
          BADGE_GAP       = int(40 * SCALE)

          LOGO_MARGIN = int(50 * SCALE)
          LOGO_MAX_W  = int(160 * SCALE)
          # -------------------------------------------------------------------

          with open(DATA, encoding="utf-8") as f:
              _all_data = json.load(f)

          AYAHS = [it for it in _all_data if extract_number(it.get('sura', '0')) == SURAH_NUMBER]
          print(f"Found {len(AYAHS)} ayahs for surah {SURAH_NUMBER}")

          _dummy = ImageDraw.Draw(Image.new("RGBA", (10, 10)))

          logo_img = None
          if LOGO_PATH and os.path.exists(LOGO_PATH):
              try:
                  _logo = Image.open(LOGO_PATH).convert("RGBA")
                  ratio = LOGO_MAX_W / _logo.width
                  new_size = (LOGO_MAX_W, max(1, int(_logo.height * ratio)))
                  logo_img = _logo.resize(new_size, Image.LANCZOS)
              except Exception as e:
                  print(f"Logo load failed: {e}")
                  logo_img = None
          else:
              print(f"Logo not found at {LOGO_PATH}, skipping logo overlay")

          def process_ayah(item):
              """একটা আয়াতের সম্পূর্ণ অ্যানিমেটেড ওভারলে (.webm) বানায়।
              multiprocessing worker হিসেবে চলে - তাই সব দরকারি জিনিস
              (fork এর মাধ্যমে ইনহেরিটেড global) এখান থেকেই অ্যাক্সেস হয়।"""
              sura_int = extract_number(item.get('sura', '0'))
              ayat_int = extract_number(item.get('verses', '0'))
              base = f"{sura_int:03d}{ayat_int:03d}"
              ayat_disp = to_bangla_num(ayat_int)

              audio_file = os.path.join(AUDIO_DIR, f"{base}.mp3")
              if not os.path.exists(audio_file):
                  print(f"Audio missing for overlay gen: {audio_file} - skip")
                  return

              duration = audio_duration(audio_file)
              draw_badge = ayat_int != 0

              arabic_text = normalize_arabic_display(item.get('names', '').strip())
              bangla_translation = item.get('name', '').strip()
              bangla_translation = re.sub(r'\s*\(\s*[0-9০-৯]+\s*\)', '', bangla_translation)
              bangla_translation = re.sub(r'\s{2,}', ' ', bangla_translation).strip()

              pill_text = f"সূরা {BN_NAME}".strip()

              ar_size, bn_size = BASE_AR_FONT, BASE_BN_FONT
              label_size = BASE_LABEL_FONT
              pill_size, badge_size = BASE_PILL_FONT, BASE_BADGE_FONT

              while True:
                  f_pill  = get_font(False, pill_size * SCALE)
                  f_badge = get_font(False, badge_size * SCALE)
                  f_ar    = get_font(True, ar_size * SCALE)
                  f_label = get_font(False, label_size * SCALE)
                  f_bn    = get_font(False, bn_size * SCALE)

                  max_pill_w = W * 0.55
                  while _dummy.textlength(pill_text, font=f_pill) > max_pill_w and pill_size > FONT_FLOOR:
                      pill_size -= 2
                      f_pill = get_font(False, pill_size * SCALE)

                  badge_diam = int(f_pill.size * 2.3)

                  ar_lines = wrap_text(_dummy, arabic_text, f_ar, MAX_TEXT_W - 2 * BAR_PAD_X)
                  bn_lines = wrap_text(_dummy, bangla_translation, f_bn, MAX_TEXT_W - 2 * BAR_PAD_X)

                  badge_row_h = badge_diam + GAP
                  ar_bar_h    = len(ar_lines) * int(f_ar.size * 1.5) + 2 * BAR_PAD_Y
                  label_h     = int(f_label.size * 1.4)
                  bn_bar_h    = label_h + len(bn_lines) * int(f_bn.size * 1.45) + 2 * BAR_PAD_Y

                  total_h = badge_row_h + GAP + ar_bar_h + GAP + bn_bar_h

                  if total_h <= H * MAX_BLOCK_RATIO or (ar_size <= FONT_FLOOR and bn_size <= FONT_FLOOR):
                      break
                  ar_size = max(FONT_FLOOR, ar_size - 2)
                  bn_size = max(FONT_FLOOR, bn_size - 2)
                  label_size = max(FONT_FLOOR - 4, label_size - 1)

              block_bottom = H - BOTTOM_MARGIN
              block_top = block_bottom - total_h
              block_top = max(TOP_LIMIT, block_top)

              cx = W // 2
              pill_w = _dummy.textlength(pill_text, font=f_pill) + 2 * BADGE_PAD_X
              pill_h = badge_diam
              if draw_badge:
                  row_total_w = pill_w + BADGE_GAP + badge_diam
              else:
                  row_total_w = pill_w
              row_left = cx - row_total_w / 2

              total_bn_chars = sum(len(l) for l in bn_lines)
              typing_time = max(MIN_TYPING_TIME, total_bn_chars * SECONDS_PER_CHAR)
              typing_time = min(typing_time, max(MIN_TYPING_TIME, duration - 0.3))

              def render_frame(revealed, fade):
                  cur_bn_lines = revealed_lines(bn_lines, revealed)
                  img = Image.new("RGBA", (W, H), (0, 0, 0, 0))
                  d = ImageDraw.Draw(img)
                  y = block_top

                  pill_box = [row_left, y, row_left + pill_w, y + pill_h]
                  d.rounded_rectangle(pill_box, radius=pill_h // 2, fill=PILL_BG)
                  ptx = row_left + BADGE_PAD_X
                  pty = y + (pill_h - f_pill.size) / 2 - int(6 * SCALE)
                  d.text((ptx, pty), pill_text, font=f_pill, fill=PILL_TEXT)

                  if draw_badge:
                      circle_cx = row_left + pill_w + BADGE_GAP
                      circle_box = [circle_cx, y, circle_cx + badge_diam, y + badge_diam]
                      d.ellipse(circle_box, fill=BADGE_BG)
                      draw_centered(d, circle_cx + badge_diam / 2,
                                    y + (badge_diam - f_badge.size) / 2 - int(4 * SCALE),
                                    ayat_disp, f_badge, BADGE_TEXT)

                  y += badge_row_h + GAP

                  bar_box = [SIDE_MARGIN, y, W - SIDE_MARGIN, y + ar_bar_h]
                  d.rounded_rectangle(bar_box, radius=int(18 * SCALE), fill=BAR_BG)
                  ty = y + BAR_PAD_Y
                  for line in ar_lines:
                      draw_centered(d, cx, ty, line, f_ar, WHITE)
                      ty += int(f_ar.size * 1.5)

                  y += ar_bar_h + GAP

                  bar_box2 = [SIDE_MARGIN, y, W - SIDE_MARGIN, y + bn_bar_h]
                  d.rounded_rectangle(bar_box2, radius=int(18 * SCALE), fill=BAR_BG)
                  ty = y + BAR_PAD_Y
                  draw_centered(d, cx, ty, "কানযুল ঈমান থেকে অনুবাদ:", f_label, GOLD)
                  ty += label_h
                  for line in cur_bn_lines:
                      draw_centered(d, cx, ty, line, f_bn, WHITE)
                      ty += int(f_bn.size * 1.45)

                  if logo_img is not None:
                      lx = W - LOGO_MARGIN - logo_img.width
                      ly = LOGO_MARGIN
                      img.alpha_composite(logo_img, (lx, ly))

                  if fade < 1.0:
                      r, g, b, a = img.split()
                      a = a.point(lambda p: int(p * fade))
                      img = Image.merge("RGBA", (r, g, b, a))
                  return img

              # ---- কীফ্রেম টাইমলাইন তৈরি: ফ্রেম সংখ্যা টেক্সটের দৈর্ঘ্যের
              # সমানুপাতিক, অডিওর দৈর্ঘ্যের না। টাইপিং শেষে শুধু ১টা hold
              # ফ্রেম বানিয়ে ffmpeg-কে সেটার "duration" বলে দেওয়া হয়। ----
              keyframes = []  # list of (time, revealed_chars, fade)

              for i in range(N_FADE_STEPS + 1):
                  t = (FADE_IN_SECONDS * i) / N_FADE_STEPS if N_FADE_STEPS > 0 else FADE_IN_SECONDS
                  fade = min(1.0, t / FADE_IN_SECONDS) if FADE_IN_SECONDS > 0 else 1.0
                  revealed = int(total_bn_chars * min(1.0, t / typing_time)) if typing_time > 0 else total_bn_chars
                  keyframes.append((t, revealed, fade))

              last_t = keyframes[-1][0]
              last_revealed = keyframes[-1][1]
              if typing_time > 0:
                  step = SECONDS_PER_CHAR
                  t = last_t + step
                  while t < typing_time and last_revealed < total_bn_chars:
                      revealed = int(total_bn_chars * (t / typing_time))
                      if revealed > last_revealed:
                          keyframes.append((t, revealed, 1.0))
                          last_revealed = revealed
                      t += step

              if last_revealed < total_bn_chars:
                  keyframes.append((typing_time, total_bn_chars, 1.0))

              # ডুপ্লিকেট সময়/একই revealed-fade জোড়া বাদ দেওয়া
              cleaned = []
              for kf in keyframes:
                  if cleaned and cleaned[-1][1] == kf[1] and cleaned[-1][2] == kf[2]:
                      continue
                  cleaned.append(kf)
              keyframes = cleaned

              frame_dir = os.path.join(FRAMES_ROOT, base)
              os.makedirs(frame_dir, exist_ok=True)

              concat_lines = []
              for idx, (t, revealed, fade) in enumerate(keyframes):
                  frame = render_frame(revealed, fade)
                  fname = f"frame_{idx:03d}.png"
                  fpath = os.path.join(frame_dir, fname)
                  frame.save(fpath)

                  if idx + 1 < len(keyframes):
                      seg_duration = max(0.02, keyframes[idx + 1][0] - t)
                  else:
                      seg_duration = max(0.1, (duration + 0.2) - t)  # শেষ ফ্রেম বাকি পুরো সময় ধরে রাখা

                  concat_lines.append(f"file '{os.path.abspath(fpath)}'")
                  concat_lines.append(f"duration {seg_duration:.3f}")

              # ffmpeg concat demuxer-এর একটা পরিচিত কোয়ার্ক: শেষ ফাইলের
              # duration লাইনটা অনেক সময় respect হয় না, তাই শেষ ফাইলটা
              # আরেকবার (duration ছাড়া) রিপিট করে দেওয়া হয়
              concat_lines.append(f"file '{os.path.abspath(os.path.join(frame_dir, f'frame_{len(keyframes)-1:03d}.png'))}'")

              list_path = os.path.join(frame_dir, "concat.txt")
              with open(list_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(concat_lines))

              out_path = os.path.join(OUT_DIR, f"{base}.webm")
              subprocess.run([
                  "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                  "-f", "concat", "-safe", "0", "-i", list_path,
                  "-vsync", "vfr",
                  "-c:v", "libvpx-vp9",
                  "-pix_fmt", "yuva420p",
                  "-auto-alt-ref", "0",
                  "-b:v", "0",
                  "-crf", "32",
                  out_path
              ], check=True)

              shutil.rmtree(frame_dir, ignore_errors=True)
              print(f"Done {out_path} | rendered_frames={len(keyframes)} | typing_time={typing_time:.2f}s | duration={duration:.2f}s")

          if AYAHS:
              workers = max(1, min(len(AYAHS), multiprocessing.cpu_count()))
              print(f"Rendering {len(AYAHS)} ayah overlays using {workers} parallel worker(s)...")
              with multiprocessing.get_context("fork").Pool(processes=workers) as pool:
                  pool.map(process_ayah, AYAHS)

          shutil.rmtree(FRAMES_ROOT, ignore_errors=True)
          PY

      # ---------------------------------------------------------
      # ধাপ ৪: প্রতিটা আয়াতের ক্লিপ বানানো (boomerang background + animated
      # webm overlay + audio)। background-এর running offset লজিক আগের
      # মতোই অক্ষত - শুধু normal loop-এর বদলে boomerang সেগমেন্ট লুপ হচ্ছে,
      # এবং static PNG-র বদলে animated webm overlay হচ্ছে।
      # ---------------------------------------------------------
      - name: Build per-ayah clips and merge
        env:
          AUDIO_DIR: ${{ inputs.audio_folder }}
          SURAH: ${{ inputs.surah_number }}
        run: |
          set -e
          TEMP_VIDEO_DIR="temp_${SURAH}_videos"
          FINAL_DIR="rizwanSurahVideo"
          BG_PLAYBACK="normalized/background_playback.mp4"

          mkdir -p "$TEMP_VIDEO_DIR" "$FINAL_DIR"

          OFFSET=0

          for overlay_file in $(ls overlays_anim/${SURAH}*.webm 2>/dev/null | sort -V); do
            [ -e "$overlay_file" ] || continue
            base=$(basename "$overlay_file" .webm)
            audio_file="$AUDIO_DIR/$base.mp3"

            if [ ! -f "$audio_file" ]; then
              echo "Audio missing: $audio_file - Skipping"
              continue
            fi

            DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$audio_file")
            echo "Processing $base | background offset: ${OFFSET}s | audio duration: ${DURATION}s"

            ffmpeg -y -hide_banner -loglevel error \
              -ss "$OFFSET" -stream_loop -1 -i "$BG_PLAYBACK" \
              -i "$overlay_file" \
              -i "$audio_file" \
              -filter_complex "[1:v]format=yuva420p[ov];[0:v][ov]overlay=0:0:shortest=1[outv]" \
              -map "[outv]" -map 2:a \
              -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
              -c:a aac -b:a 192k \
              -shortest \
              "$TEMP_VIDEO_DIR/$base.mp4"

            OFFSET=$(echo "$OFFSET + $DURATION" | bc)
          done

          if ! ls "$TEMP_VIDEO_DIR"/${SURAH}*.mp4 1> /dev/null 2>&1; then
            echo "Kono clip toiri hoyni Surah $SURAH er jonno - overlay ba audio file check koro"
            exit 1
          fi

          ls -1 "$TEMP_VIDEO_DIR"/${SURAH}*.mp4 | sort -V | while read f; do
            echo "file '$(realpath "$f")'"
          done > concat_list.txt

          ffmpeg -y -hide_banner -loglevel error \
            -f concat -safe 0 -i concat_list.txt \
            -c copy \
            "$FINAL_DIR/${SURAH}_4K.mp4"

          ls -lh "$FINAL_DIR"/
          rm -rf "$TEMP_VIDEO_DIR" concat_list.txt

      # ---------------------------------------------------------
      # ধাপ ৫: master (4K) ভিডিও থেকেই Full HD ও HD ভার্সন বানানো (আগের মতোই)
      # ---------------------------------------------------------
      - name: Create Full HD & HD versions from the 4K master
        env:
          SURAH: ${{ inputs.surah_number }}
        run: |
          set -e
          FINAL_DIR="rizwanSurahVideo"
          MASTER="$FINAL_DIR/${SURAH}_4K.mp4"

          echo "Creating Full HD (1080x1920) version..."
          ffmpeg -y -hide_banner -loglevel error \
            -i "$MASTER" \
            -vf "scale=1080:1920:flags=lanczos,setsar=1" \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a copy \
            "$FINAL_DIR/${SURAH}_FullHD.mp4"

          echo "Creating HD (720x1280) version..."
          ffmpeg -y -hide_banner -loglevel error \
            -i "$MASTER" \
            -vf "scale=720:1280:flags=lanczos,setsar=1" \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -c:a copy \
            "$FINAL_DIR/${SURAH}_HD.mp4"

          rm -rf normalized
          ls -lh "$FINAL_DIR"/

      - name: Upload Final Videos (workflow artifact - temporary)
        uses: actions/upload-artifact@v4
        with:
          name: Surah-${{ inputs.surah_number }}-Portrait-Video-AllResolutions
          path: |
            rizwanSurahVideo/${{ inputs.surah_number }}_4K.mp4
            rizwanSurahVideo/${{ inputs.surah_number }}_FullHD.mp4
            rizwanSurahVideo/${{ inputs.surah_number }}_HD.mp4
          if-no-files-found: error

      # ---------------------------------------------------------
      # ধাপ ৬: 4K, Full HD ও HD - তিনটা ফাইলই একসাথে একই GitHub Release-এ
      # পাবলিশ করা হচ্ছে
      # ---------------------------------------------------------
      - name: Publish Surah Video (4K + Full HD + HD) as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surah-${{ inputs.surah_number }}
          name: "সূরা ${{ inputs.bangla_name }} (নং ${{ inputs.surah_number }}) - Portrait Video"
          body: |
            🎬 সূরা ${{ inputs.bangla_name }} (সূরা নং ${{ inputs.surah_number }}) এর পোর্ট্রেট (৯:১৬) ভিডিও - তিনটা রেজোলিউশনে:
            - 4K: ${{ inputs.target_width }}x${{ inputs.target_height }}
            - Full HD: 1080x1920
            - HD: 720x1280
          files: |
            rizwanSurahVideo/${{ inputs.surah_number }}_4K.mp4
            rizwanSurahVideo/${{ inputs.surah_number }}_FullHD.mp4
            rizwanSurahVideo/${{ inputs.surah_number }}_HD.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit animated overlays to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f overlays_anim/
          git commit -m "Surah ${{ inputs.surah_number }}: animated typewriter overlays generated (video published via Release)" || echo "No changes"
          git push || echo "Push failed"
