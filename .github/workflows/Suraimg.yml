name: Generate Ayah Images - 001001 Format

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install Pillow

      - name: Generate
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json, os, re

          BG="src/background.jpg"; LOGO="src/logo.jpg"; DATA="src/data.json"; DETAILS="src/details.txt"; OUT="output"
          FONT_BN="src/solaimanlipi.ttf"; FONT_AR="src/noorehuda.ttf"

          EN_TO_BN=str.maketrans("0123456789","০১২৩৪৫৬৭৮৯")
          def to_bangla_num(s): return str(s).translate(EN_TO_BN)
          def extract_number(s):
              s=str(s).translate(str.maketrans("০১২৩৪৫৬৭৮৯","0123456789"))
              m=re.search(r'\d+',s)
              return int(m.group()) if m else 0

          # Max Res + Glitch Fix
          W,H=3840,2160
          bg_img=None
          try:
              if os.path.exists(BG):
                  with Image.open(BG) as im: im.verify()
                  bg_img=Image.open(BG).convert("RGB")
                  W,H=bg_img.size
          except:
              bg_img=Image.new("RGB",(W,H),(232,236,244))

          LEFT_W=int(W*0.18); SCALE=W/1280

          def get_font(is_ar, base):
              size=int(base*SCALE)
              custom=FONT_AR if is_ar else FONT_BN
              if os.path.exists(custom):
                  try: return ImageFont.truetype(custom, size)
                  except: pass
              return ImageFont.load_default()

          def load_details():
              d={}
              if os.path.exists(DETAILS):
                  with open(DETAILS,encoding="utf-8") as f:
                      for line in f:
                          if not line.strip(): continue
                          p=line.strip().split("|")
                          if len(p)>=3: d[p[0].strip().zfill(3)]={"ar":p[1].strip(),"bn":p[2].strip()}
              return d

          os.makedirs(OUT,exist_ok=True)
          details_map=load_details()
          with open(DATA,encoding="utf-8") as f: data=json.load(f)

          for item in data:
              sura_int=extract_number(item.get('sura','0'))
              ayat_int=extract_number(item.get('verses','0'))
              s_no_int=extract_number(item.get('sura_no_en',sura_int))

              # --- YOUR REQUIRED FILENAME FORMAT ---
              # 1,1 -> 001001.jpg | 124,1 -> 124001.jpg | 2,270 -> 002270.jpg
              filename = f"{sura_int:03d}{ayat_int:03d}.jpg"

              sura_bn=to_bangla_num(str(sura_int))
              ayat_bn=to_bangla_num(str(ayat_int))

              bg=bg_img.copy() if bg_img.size==(W,H) else bg_img.resize((W,H), Image.LANCZOS)
              draw=ImageDraw.Draw(bg)
              draw.rectangle([0,0,LEFT_W,H],fill=(214,218,228))
              draw.line([(LEFT_W,0),(LEFT_W,H)],fill=(35,45,85),width=int(3*SCALE))

              if os.path.exists(LOGO):
                  try:
                      ls=int(160*SCALE)
                      logo=Image.open(LOGO).convert("RGBA").resize((ls,ls),Image.LANCZOS)
                      bg.paste(logo,(int(35*SCALE),int(20*SCALE)),logo)
                  except: pass

              f_bn_s=get_font(False,32); f_bn_m=get_font(False,28); f_bn_l=get_font(False,34); f_ar_l=get_font(True,52)

              draw.text((int(40*SCALE),int(210*SCALE)),f"সূরা: {sura_bn}",font=f_bn_s,fill=(0,0,0))
              draw.text((int(40*SCALE),int(260*SCALE)),f"আয়াত: {ayat_bn}",font=f_bn_s,fill=(0,0,0))
              draw.line([(int(40*SCALE),int(320*SCALE)),(int(180*SCALE),int(320*SCALE))],fill=(100,100,120),width=int(1*SCALE))

              info=details_map.get(f"{s_no_int:03d}",{})
              if info:
                  txt=f"{info.get('bn','')} - {info.get('ar','')}"
                  tmp=Image.new("RGBA",(int(700*SCALE),int(60*SCALE)),(0,0,0,0))
                  ImageDraw.Draw(tmp).text((0,0),txt,font=f_bn_s,fill=(0,0,0))
                  bg.paste(tmp.rotate(90,expand=True),(int(25*SCALE),int(340*SCALE)),tmp.rotate(90,expand=True))

              y=int(50*SCALE)
              for line in item.get('names','').split("\n"):
                  w=draw.textlength(line,font=f_ar_l)
                  draw.text((W-int(50*SCALE)-w,y),line,font=f_ar_l,fill=(0,0,0))
                  y+=int(75*SCALE)

              y+=int(30*SCALE)
              draw.text((LEFT_W+int(30*SCALE),y),"কানযুল ঈমান থেকে অনুবাদ:",font=f_bn_m,fill=(20,40,120))
              y+=int(50*SCALE)

              # Justify Bengali
              trans=item.get('name','')
              max_w=W-LEFT_W-int(80*SCALE)
              lines=[]
              for para in trans.split("\n"):
                  cur=""
                  for w in para.split():
                      test=f"{cur} {w}".strip()
                      if draw.textlength(test,font=f_bn_l)<=max_w: cur=test
                      else:
                          if cur: lines.append(cur)
                          cur=w
                  if cur: lines.append(cur)

              for i,line in enumerate(lines):
                  is_last=i==len(lines)-1
                  if not is_last and len(line.split())>1:
                      extra=max_w-draw.textlength(line,font=f_bn_l)
                      se=extra/(len(line.split())-1)
                      tx=LEFT_W+int(30*SCALE)
                      for w in line.split():
                          draw.text((tx,y),w,font=f_bn_l,fill=(15,25,85))
                          tx+=draw.textlength(w,font=f_bn_l)+draw.textlength(" ",font=f_bn_l)+se
                  else:
                      draw.text((LEFT_W+int(30*SCALE),y),line,font=f_bn_l,fill=(15,25,85))
                  y+=int(50*SCALE)

              bg.save(os.path.join(OUT,filename),"JPEG",quality=100,dpi=(300,300),subsampling=0)
              print(f"Generated {filename}")
          PY

      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "fix filename 001001.jpg format"
          git push
