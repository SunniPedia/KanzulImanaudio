name: Generate Ayah Images

on:
  workflow_dispatch:
    inputs:
      arabic_name:
        description: 'আরবি সূরার নাম (উপরে থাকবে)'
        required: true
        type: string
      bangla_name:
        description: 'বাংলা সূরার নাম (নিচে থাকবে)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install Pillow arabic-reshaper python-bidi

      - name: Generate Fixed Images
        env:
          ARABIC_NAME: ${{ inputs.arabic_name }}
          BANGLA_NAME: ${{ inputs.bangla_name }}
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json, os, re, shutil
          import arabic_reshaper
          from bidi.algorithm import get_display

          BG="src/background.jpg"
          LOGO="src/logo.jpg"
          DATA="src/data.json"
          OUT="output"
          FONT_BN="src/solaimanlipi.ttf"
          FONT_AR="src/noorehuda.ttf"

          AR_NAME=os.environ.get("ARABIC_NAME","").strip()
          BN_NAME=os.environ.get("BANGLA_NAME","").strip()

          if os.path.exists(OUT):
              shutil.rmtree(OUT)
          os.makedirs(OUT, exist_ok=True)

          EN_TO_BN=str.maketrans("0123456789","০১২৩৪৫৬৭৮৯")
          BN_TO_EN=str.maketrans("০১২৩৪৫৬৭৮৯","0123456789")
          def to_bangla_num(s): return str(s).translate(EN_TO_BN)
          def extract_number(s):
              s=str(s).translate(BN_TO_EN)
              m=re.search(r'\d+',s)
              return int(m.group()) if m else 0
          def clean_name(text):
              text = re.sub(r'\s*\(\s*[0-9০-৯]+\s*\)', '', text)
              return re.sub(r'\s{2,}', ' ', text).strip()

          def clean_arabic_text(text):
              # Remove all ayah number circles and symbols: ﴿ ﴾ ۝ ۛ ۚ ۙ etc and digits
              # Keep Arabic letters and waqf signs like لا but attach it
              text = re.sub(r'[﴿﴾۝\d٠-٩0-9]+', '', text)
              # Remove extra small stop symbols isolated - keep لا inside
              text = re.sub(r'\s*[ۛۚۙۗۘ]+\s*', ' ', text)
              text = re.sub(r'\s{2,}', ' ', text).strip()
              return text

          def get_arabic_display(text):
              try:
                  reshaped = arabic_reshaper.reshape(text)
                  return get_display(reshaped)
              except:
                  return text

          W,H=3840,2160
          bg_img=Image.open(BG).convert("RGB") if os.path.exists(BG) else Image.new("RGB",(W,H),(232,236,244))
          W,H=bg_img.size

          LEFT_W=int(W*0.22)
          SCALE=W/1280

          def get_font_by_size(is_ar, px_size):
              p=FONT_AR if is_ar else FONT_BN
              try: return ImageFont.truetype(p, int(px_size))
              except: return ImageFont.load_default()
          def get_font(is_ar, dp):
              return get_font_by_size(is_ar, dp*SCALE)

          with open(DATA, encoding="utf-8") as f:
              data=json.load(f)

          # FIXED: Use constants, never mutate globally
          CONST_SURA=40
          CONST_DETAILS=68
          CONST_KANZUL=42
          CONST_BN=52
          CONST_AR=80

          SURA_Y=int(300*SCALE)
          AYAT_Y=SURA_Y + int(CONST_SURA*SCALE*1.6)
          LINE_Y=AYAT_Y + int(CONST_SURA*SCALE*1.6)
          BOTTOM_MARGIN_DP = 5
          BOTTOM_MARGIN = int(BOTTOM_MARGIN_DP * SCALE)
          TOP_MARGIN = int(120*SCALE)
          SIDE_MARGIN=int(30*SCALE)
          AVAIL_W_NAMES = LEFT_W - 2*SIDE_MARGIN
          DETAILS_FLOOR=32
          GAP_Y_DETAILS=int(22*SCALE)

          _dummy_draw=ImageDraw.Draw(Image.new("RGB",(10,10)))
          # Calculate details font size once
          temp_DET=72
          while True:
              f_ar_det=get_font_by_size(True, temp_DET*SCALE)
              f_bn_det=get_font_by_size(False, temp_DET*SCALE)
              AR_NAME_W=_dummy_draw.textlength(AR_NAME, font=f_ar_det)
              BN_NAME_W=_dummy_draw.textlength(BN_NAME, font=f_bn_det)
              if max(AR_NAME_W, BN_NAME_W) <= AVAIL_W_NAMES or temp_DET <= DETAILS_FLOOR:
                  final_details_size=temp_DET
                  break
              temp_DET -= 2

          NAMES_Y = LINE_Y + int(55*SCALE)

          def draw_centered_label_colon(draw, y, label, value, font, fill):
              label_w = draw.textlength(label, font=font)
              colon_w = draw.textlength(":", font=font)
              value_w = draw.textlength(" "+value, font=font) if value else 0
              total_w = label_w + colon_w + value_w
              start_x = (LEFT_W - total_w) // 2
              draw.text((start_x, y), label, font=font, fill=fill)
              colon_up = int(font.size * 0.12)
              draw.text((start_x+label_w, y-colon_up), ":", font=font, fill=fill)
              if value:
                  draw.text((start_x+label_w+colon_w, y), " "+value, font=font, fill=fill)

          def draw_label_colon(draw, x, y, label, value, font, fill):
              draw.text((x, y), label, font=font, fill=fill)
              label_w = draw.textlength(label, font=font)
              colon_up = int(font.size * 0.12)
              draw.text((x+label_w, y-colon_up), ":", font=font, fill=fill)
              colon_w = draw.textlength(":", font=font)
              if value:
                  draw.text((x+label_w+colon_w, y), " "+value, font=font, fill=fill)

          for item in data:
              sura_int=extract_number(item.get('sura','0'))
              ayat_int=extract_number(item.get('verses','0'))
              filename=f"{sura_int:03d}{ayat_int:03d}.jpg"

              def disp(n): return f"0{n}" if n<10 else str(n)
              sura_disp=to_bangla_num(disp(sura_int))
              ayat_disp=to_bangla_num(disp(ayat_int))

              # FIXED: Reset per image - never reuse mutated base
              cur_AR = CONST_AR
              cur_BN = CONST_BN

              bg=bg_img.resize((W,H), Image.LANCZOS)
              draw=ImageDraw.Draw(bg)
              draw.rectangle([0,0,LEFT_W,H], fill=(214,218,228))
              draw.line([(LEFT_W,0),(LEFT_W,H)], fill=(35,45,85), width=int(4*SCALE))

              if os.path.exists(LOGO):
                  try:
                      ls=int(200*SCALE)
                      logo=Image.open(LOGO).convert("RGBA").resize((ls,ls), Image.LANCZOS)
                      bg.paste(logo,(int((LEFT_W-ls)//2), int(30*SCALE)), logo)
                  except: pass

              f_sura=get_font(False, CONST_SURA)
              f_kanzul=get_font(False, CONST_KANZUL)
              max_w=W-LEFT_W-int(140*SCALE)

              # FIXED: Clean arabic and separate number
              arabic_cleaned = clean_arabic_text(item.get('names','').strip())
              arabic_display = get_arabic_display(arabic_cleaned)

              # Calculate arabic lines with fixed logic
              while True:
                  f_ar=get_font(True, cur_AR)
                  arabic_lines=[]
                  cur=""
                  for w in arabic_cleaned.split():
                      test=f"{cur} {w}".strip()
                      # Use reshaped for measurement
                      test_disp = get_arabic_display(test)
                      if draw.textlength(test_disp, font=f_ar) <= max_w:
                          cur=test
                      else:
                          if cur: arabic_lines.append(cur)
                          cur=w
                  if cur: arabic_lines.append(cur)
                  ar_block_h = len(arabic_lines) * int(cur_AR*SCALE*1.5)
                  if ar_block_h <= (H - int(200*SCALE)) * 0.55 or cur_AR <= 50:
                      break
                  cur_AR -= 2

              # FIXED: Bangla wrap with fresh variable
              temp_BN = cur_BN
              while True:
                  f_bn=get_font(False, temp_BN)
                  cleaned=clean_name(item.get('name',''))
                  bn_lines=[]
                  cur=""
                  for w in cleaned.split():
                      test=f"{cur} {w}".strip()
                      if draw.textlength(test, font=f_bn) <= max_w:
                          cur=test
                      else:
                          if cur: bn_lines.append(cur)
                          cur=w
                  if cur: bn_lines.append(cur)
                  needed = len(arabic_lines)*int(cur_AR*SCALE*1.5) + int(50*SCALE) + int(75*SCALE) + len(bn_lines)*int(temp_BN*SCALE*1.45)
                  if needed < H - TOP_MARGIN - BOTTOM_MARGIN or temp_BN <= 30:
                      cur_BN = temp_BN
                      break
                  temp_BN -= 2

              f_bn=get_font(False, cur_BN)
              f_ar=get_font(True, cur_AR)

              arabic_block_h = len(arabic_lines) * int(cur_AR*SCALE*1.5)
              gap_after_arabic = int(50*SCALE)
              kanzul_block_h = int(75*SCALE)
              bn_block_h = len(bn_lines) * int(cur_BN*SCALE*1.4)
              total_block_h = arabic_block_h + gap_after_arabic + kanzul_block_h + bn_block_h

              start_y = max(TOP_MARGIN, (H - total_block_h - BOTTOM_MARGIN) // 2)
              if start_y + total_block_h + BOTTOM_MARGIN > H:
                  start_y = H - total_block_h - BOTTOM_MARGIN

              draw_centered_label_colon(draw, SURA_Y, "সূরা", sura_disp, f_sura, (0,0,0))
              draw_centered_label_colon(draw, AYAT_Y, "আয়াত", ayat_disp, f_sura, (0,0,0))
              draw.line([(int(40*SCALE), LINE_Y), (int(LEFT_W-40*SCALE), LINE_Y)], fill=(100,100,120), width=2)

              f_ar_det=get_font_by_size(True, final_details_size*SCALE)
              f_bn_det=get_font_by_size(False, final_details_size*SCALE)
              ar_w = draw.textlength(AR_NAME, font=f_ar_det)
              bn_w = draw.textlength(BN_NAME, font=f_bn_det)
              ar_x = (LEFT_W - ar_w)//2
              bn_x = (LEFT_W - bn_w)//2
              dy = NAMES_Y
              draw.text((ar_x, dy), AR_NAME, font=f_ar_det, fill=(20,20,60))
              dy += int(final_details_size*SCALE*1.6) + GAP_Y_DETAILS
              draw.text((bn_x, dy), BN_NAME, font=f_bn_det, fill=(20,20,60))

              y=start_y
              # Draw Arabic lines
              for idx, line in enumerate(arabic_lines):
                  line_disp = get_arabic_display(line)
                  w=draw.textlength(line_disp, font=f_ar)
                  x_pos = W-int(70*SCALE)-w
                  draw.text((x_pos, y), line_disp, font=f_ar, fill=(0,0,0))

                  # FIXED: Draw ayah number circle only on last line, left side (end of ayah)
                  if idx == len(arabic_lines)-1:
                      # Draw number in decorative circle at end
                      ayah_num_ar = str(ayat_int) # use arabic-indic if you want: to_bangla? but keep english for font
                      # Convert to Arabic-Indic digits ٠١٢
                      ar_digits = str(ayat_int).translate(str.maketrans("0123456789","٠١٢٣٤٥٦٧٨٩"))
                      num_text = f"﴿{ar_digits}﴾"
                      num_disp = get_arabic_display(num_text)
                      # Draw on left side of last line
                      num_w = draw.textlength(num_disp, font=f_ar)
                      # Position: left of the content area, not overlapping
                      num_x = LEFT_W + int(50*SCALE)
                      # If last line is long, put number below line centered left
                      if x_pos < LEFT_W + int(200*SCALE):
                          # move to next line for number
                          pass
                      else:
                          draw.text((num_x, y), num_disp, font=f_ar, fill=(0,0,0))
                  y+=int(cur_AR*SCALE*1.5)

              # If last line was too long, draw number on new line
              if len(arabic_lines) > 0:
                  last_line = get_arabic_display(arabic_lines[-1])
                  last_w = draw.textlength(last_line, font=f_ar)
                  last_x = W-int(70*SCALE)-last_w
                  if last_x < LEFT_W + int(200*SCALE):
                      ar_digits = str(ayat_int).translate(str.maketrans("0123456789","٠١٢٣٤٥٦٧٨٩"))
                      num_text = f"﴿{ar_digits}﴾"
                      num_disp = get_arabic_display(num_text)
                      draw.text((LEFT_W + int(50*SCALE), y), num_disp, font=f_ar, fill=(0,0,0))
                      y+=int(cur_AR*SCALE*1.5)

              y+=int(50*SCALE)
              draw_label_colon(draw, LEFT_W+int(50*SCALE), y, "কানযুল ঈমান থেকে অনুবাদ", "", f_kanzul, (20,40,120))
              y+=int(75*SCALE)

              for i,line in enumerate(bn_lines):
                  words=line.split()
                  is_last=i==len(bn_lines)-1
                  if not is_last and len(words)>1:
                      base_w=sum(draw.textlength(w, font=f_bn) for w in words) + draw.textlength(" ", font=f_bn)*(len(words)-1)
                      extra=max_w-base_w
                      gap=extra/(len(words)-1) if len(words)>1 else 0
                      if 0 < gap < 70*SCALE:
                          tx=LEFT_W+int(50*SCALE)
                          for w in words:
                              draw.text((tx,y), w, font=f_bn, fill=(15,25,85))
                              tx+=draw.textlength(w, font=f_bn)+draw.textlength(" ", font=f_bn)+gap
                      else:
                          draw.text((LEFT_W+int(50*SCALE), y), line, font=f_bn, fill=(15,25,85))
                  else:
                      draw.text((LEFT_W+int(50*SCALE), y), line, font=f_bn, fill=(15,25,85))
                  y+=int(cur_BN*SCALE*1.4)

              bg.save(os.path.join(OUT, filename), "JPEG", quality=95, subsampling=0)
              print(f"Done {filename} AR {cur_AR} BN {cur_BN} start_y={start_y}")

          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayah-images
          path: output/
          retention-days: 7

      - name: Push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          git commit -m "fix: ayah number circle consistent + font reset bug" || echo "no changes"
          git push
