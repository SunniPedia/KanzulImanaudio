name: Generate Ayah Images

on:
  workflow_dispatch:
    inputs:
      arabic_name:
        description: 'আরবি সূরার নাম (উপরে থাকবে)'
        required: true
        type: string
      bangla_name:
        description: 'বাংলা সূরার নাম (নিচে থাকবে)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install Pillow

      - name: Generate Fixed Images
        env:
          ARABIC_NAME: ${{ inputs.arabic_name }}
          BANGLA_NAME: ${{ inputs.bangla_name }}
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json, os, re, shutil, sys

          BG="src/background.jpg"
          LOGO="src/logo.jpg"
          DATA="src/data.json"
          OUT="output"
          FONT_BN="src/solaimanlipi.ttf"
          FONT_AR="src/noorehuda.ttf"

          AR_NAME=os.environ.get("ARABIC_NAME","").strip()
          BN_NAME=os.environ.get("BANGLA_NAME","").strip()
          print(f"ARABIC_NAME={AR_NAME!r}, BANGLA_NAME={BN_NAME!r}")

          if os.path.exists(OUT):
              shutil.rmtree(OUT)
          os.makedirs(OUT, exist_ok=True)

          EN_TO_BN=str.maketrans("0123456789","০১২৩৪৫৬৭৮৯")
          def to_bangla_num(s): return str(s).translate(EN_TO_BN)
          def extract_number(s):
              s=str(s).translate(str.maketrans("০১২৩৪৫৬৭৮৯","0123456789"))
              m=re.search(r'\d+',s)
              return int(m.group()) if m else None
          def clean_name(text):
              text = re.sub(r'\s*\(\s*[0-9০-৯]+\s*\)', '', text)
              return re.sub(r'\s{2,}', ' ', text).strip()

          # --- Fonts must exist, otherwise output will silently render boxes/tofu ---
          missing_fonts = [p for p in (FONT_AR, FONT_BN) if not os.path.exists(p)]
          if missing_fonts:
              print(f"ERROR: Missing font file(s): {missing_fonts}")
              sys.exit(1)

          bg_img=Image.open(BG).convert("RGB") if os.path.exists(BG) else Image.new("RGB",(3840,2160),(232,236,244))
          W,H=bg_img.size

          LEFT_W=int(W*0.22)
          SCALE=W/1280
          print(f"BG Size: {W}x{H}, SCALE: {SCALE}, LEFT_W: {LEFT_W}")

          # --- Font cache: avoid reloading the same truetype font repeatedly ---
          _font_cache = {}
          def get_font_by_size(is_ar, px_size):
              px_size = max(1, int(px_size))
              key = (is_ar, px_size)
              if key in _font_cache:
                  return _font_cache[key]
              path = FONT_AR if is_ar else FONT_BN
              try:
                  font = ImageFont.truetype(path, px_size)
              except Exception as e:
                  print(f"WARNING: Failed to load font '{path}' at size {px_size}: {e}. Falling back to default font (Bangla/Arabic glyphs will NOT render correctly).")
                  font = ImageFont.load_default()
              _font_cache[key] = font
              return font

          def get_font(is_ar, dp):
              return get_font_by_size(is_ar, dp*SCALE)

          with open(DATA, encoding="utf-8") as f:
              data=json.load(f)

          # --- Validate data & detect duplicate output filenames before rendering anything ---
          seen_filenames = {}
          validated_items = []
          for idx, item in enumerate(data):
              sura_raw = item.get('sura')
              verses_raw = item.get('verses')
              sura_int = extract_number(sura_raw) if sura_raw is not None else None
              ayat_int = extract_number(verses_raw) if verses_raw is not None else None

              if sura_int is None:
                  print(f"WARNING: Item index {idx} has missing/invalid 'sura' value ({sura_raw!r}); skipping this item.")
                  continue
              if ayat_int is None:
                  print(f"WARNING: Item index {idx} (sura {sura_int}) has missing/invalid 'verses' value ({verses_raw!r}); skipping this item.")
                  continue
              if not str(item.get('names','')).strip():
                  print(f"WARNING: Item index {idx} (sura {sura_int}, ayat {ayat_int}) has empty Arabic 'names' field.")
              if not str(item.get('name','')).strip():
                  print(f"WARNING: Item index {idx} (sura {sura_int}, ayat {ayat_int}) has empty Bangla 'name' field.")

              filename=f"{sura_int:03d}{ayat_int:03d}.jpg"
              if filename in seen_filenames:
                  print(f"ERROR: Duplicate output filename '{filename}' from item index {idx} (also produced by index {seen_filenames[filename]}). Skipping duplicate to avoid overwriting.")
                  continue
              seen_filenames[filename] = idx
              validated_items.append((filename, sura_int, ayat_int, item))

          if not validated_items:
              print("ERROR: No valid items to render after validation. Exiting.")
              sys.exit(1)

          def get_font_by_size(is_ar, px_size):
              # redefined to keep the outer cache in scope after validation block
              px_size = max(1, int(px_size))
              key = (is_ar, px_size)
              if key in _font_cache:
                  return _font_cache[key]
              path = FONT_AR if is_ar else FONT_BN
              try:
                  font = ImageFont.truetype(path, px_size)
              except Exception as e:
                  print(f"WARNING: Failed to load font '{path}' at size {px_size}: {e}. Falling back to default font.")
                  font = ImageFont.load_default()
              _font_cache[key] = font
              return font

          # ORIGINAL SIZE - এগুলো কখনো change হবে না
          ORIG_SURA=40
          ORIG_DETAILS=68
          ORIG_KANZUL=42
          ORIG_BN=52
          ORIG_AR=80

          # Line-height multipliers (centralised so they're easy to tune)
          LH_SURA=1.6
          LH_AR=1.5
          LH_BN=1.4
          LH_DETAILS=1.6

          BOTTOM_MARGIN_DP = 5
          BOTTOM_MARGIN = int(BOTTOM_MARGIN_DP * SCALE)
          TOP_MARGIN = int(120*SCALE)
          SIDE_MARGIN=int(30*SCALE)
          AVAIL_W_NAMES = LEFT_W - 2*SIDE_MARGIN
          DETAILS_FLOOR=32
          GAP_Y_DETAILS=int(22*SCALE)

          # Details font - workflow এ একবারই হিসাব হবে
          _dummy_draw=ImageDraw.Draw(Image.new("RGB",(10,10)))
          cur_details_size=ORIG_DETAILS
          temp_DET=ORIG_DETAILS
          while True:
              f_ar_det=get_font_by_size(True, temp_DET*SCALE)
              f_bn_det=get_font_by_size(False, temp_DET*SCALE)
              AR_NAME_W=_dummy_draw.textlength(AR_NAME, font=f_ar_det)
              BN_NAME_W=_dummy_draw.textlength(BN_NAME, font=f_bn_det)
              if max(AR_NAME_W, BN_NAME_W) <= AVAIL_W_NAMES or temp_DET <= DETAILS_FLOOR:
                  cur_details_size=temp_DET
                  break
              temp_DET -= 2
          print(f"Details font fixed at: {cur_details_size}")

          def draw_label_colon(draw, x, y, label, value, font, fill):
              draw.text((x, y), label, font=font, fill=fill)
              label_w = draw.textlength(label, font=font)
              colon_up = int(font.size * 0.12)
              draw.text((x+label_w, y-colon_up), ":", font=font, fill=fill)
              colon_w = draw.textlength(":", font=font)
              if value:
                  draw.text((x+label_w+colon_w, y), " "+value, font=font, fill=fill)

          def draw_centered_label_colon(draw, y, label, value, font, fill):
              label_w = draw.textlength(label, font=font)
              colon_w = draw.textlength(":", font=font)
              value_w = draw.textlength(" "+value, font=font) if value else 0
              total_w = label_w + colon_w + value_w
              start_x = (LEFT_W - total_w) // 2
              draw.text((start_x, y), label, font=font, fill=fill)
              colon_up = int(font.size * 0.12)
              draw.text((start_x+label_w, y-colon_up), ":", font=font, fill=fill)
              if value:
                  draw.text((start_x+label_w+colon_w, y), " "+value, font=font, fill=fill)

          total = len(validated_items)
          for n, (filename, sura_int, ayat_int, item) in enumerate(validated_items, start=1):
              is_header = (ayat_int == 0)

              def disp(n): return f"0{n}" if n<10 else str(n)
              sura_disp=to_bangla_num(disp(sura_int))
              ayat_disp=to_bangla_num(disp(ayat_int)) if not is_header else ""

              # No need to resize: bg_img is already WxH. Just copy it.
              bg=bg_img.copy()
              draw=ImageDraw.Draw(bg)
              draw.rectangle([0,0,LEFT_W,H], fill=(214,218,228))
              draw.line([(LEFT_W,0),(LEFT_W,H)], fill=(35,45,85), width=int(4*SCALE))

              if os.path.exists(LOGO):
                  try:
                      ls=int(200*SCALE)
                      logo=Image.open(LOGO).convert("RGBA").resize((ls,ls), Image.LANCZOS)
                      bg.paste(logo,(int((LEFT_W-ls)//2), int(30*SCALE)), logo)
                  except Exception as e:
                      print(f"WARNING: Could not paste logo for {filename}: {e}")

              f_sura=get_font(False, ORIG_SURA)
              f_kanzul=get_font(False, ORIG_KANZUL)
              max_w=W-LEFT_W-int(140*SCALE)

              # Position logic - header images skip the "আয়াত" row entirely
              SURA_Y=int(300*SCALE)
              if is_header:
                  LINE_Y=SURA_Y + int(ORIG_SURA*SCALE*LH_SURA)
                  NAMES_Y = LINE_Y + int(55*SCALE)
              else:
                  AYAT_Y=SURA_Y + int(ORIG_SURA*SCALE*LH_SURA)
                  LINE_Y=AYAT_Y + int(ORIG_SURA*SCALE*LH_SURA)
                  NAMES_Y = LINE_Y + int(55*SCALE)

              # --- AR FONT LOGIC (auto-fit) ---
              cur_ar_size = ORIG_AR
              arabic_lines = []
              temp_AR = ORIG_AR
              arabic_raw=item.get('names','').strip()
              while True:
                  f_ar_temp=get_font(True, temp_AR)
                  arabic_lines=[]
                  cur=""
                  for w in arabic_raw.split():
                      test=f"{cur} {w}".strip()
                      if draw.textlength(test, font=f_ar_temp) <= max_w:
                          cur=test
                      else:
                          if cur: arabic_lines.append(cur)
                          cur=w
                  if cur: arabic_lines.append(cur)
                  ar_block_h = len(arabic_lines) * int(temp_AR*SCALE*LH_AR)
                  if ar_block_h <= (H - int(200*SCALE)) * 0.55 or temp_AR <= 50:
                      cur_ar_size = temp_AR
                      break
                  temp_AR -= 2

              f_ar = get_font(True, cur_ar_size)

              # --- BN FONT LOGIC (auto-fit) ---
              cur_bn_size = ORIG_BN
              bn_lines = []
              temp_BN = ORIG_BN
              cleaned=clean_name(item.get('name',''))
              while True:
                  f_bn_temp=get_font(False, temp_BN)
                  bn_lines=[]
                  cur=""
                  for w in cleaned.split():
                      test=f"{cur} {w}".strip()
                      if draw.textlength(test, font=f_bn_temp) <= max_w:
                          cur=test
                      else:
                          if cur: bn_lines.append(cur)
                          cur=w
                  if cur: bn_lines.append(cur)
                  needed = len(arabic_lines)*int(cur_ar_size*SCALE*LH_AR) + int(50*SCALE) + int(75*SCALE) + len(bn_lines)*int(temp_BN*SCALE*1.45)
                  if needed < H - TOP_MARGIN - BOTTOM_MARGIN or temp_BN <= 30:
                      cur_bn_size = temp_BN
                      break
                  temp_BN -= 2

              f_bn=get_font(False, cur_bn_size)

              arabic_block_h = len(arabic_lines) * int(cur_ar_size*SCALE*LH_AR)
              gap_after_arabic = int(50*SCALE)
              kanzul_block_h = int(75*SCALE)
              bn_block_h = len(bn_lines) * int(cur_bn_size*SCALE*LH_BN)
              total_block_h = arabic_block_h + gap_after_arabic + kanzul_block_h + bn_block_h

              start_y = max(TOP_MARGIN, (H - total_block_h - BOTTOM_MARGIN) // 2)
              if start_y + total_block_h + BOTTOM_MARGIN > H:
                  start_y = H - total_block_h - BOTTOM_MARGIN

              # Draw সূরা (always) and আয়াত (only when not a header image)
              draw_centered_label_colon(draw, SURA_Y, "সূরা", sura_disp, f_sura, (0,0,0))
              if not is_header:
                  draw_centered_label_colon(draw, AYAT_Y, "আয়াত", ayat_disp, f_sura, (0,0,0))

              draw.line([(int(40*SCALE), LINE_Y), (int(LEFT_W-40*SCALE), LINE_Y)], fill=(100,100,120), width=2)

              f_ar_det=get_font_by_size(True, cur_details_size*SCALE)
              f_bn_det=get_font_by_size(False, cur_details_size*SCALE)
              ar_w = draw.textlength(AR_NAME, font=f_ar_det)
              bn_w = draw.textlength(BN_NAME, font=f_bn_det)
              ar_x = (LEFT_W - ar_w)//2
              bn_x = (LEFT_W - bn_w)//2
              dy = NAMES_Y
              draw.text((ar_x, dy), AR_NAME, font=f_ar_det, fill=(20,20,60))
              dy += int(cur_details_size*SCALE*LH_DETAILS) + GAP_Y_DETAILS
              draw.text((bn_x, dy), BN_NAME, font=f_bn_det, fill=(20,20,60))

              y=start_y
              for line in arabic_lines:
                  w=draw.textlength(line, font=f_ar)
                  draw.text((W-int(70*SCALE)-w, y), line, font=f_ar, fill=(0,0,0))
                  y+=int(cur_ar_size*SCALE*LH_AR)

              y+=int(50*SCALE)
              draw_label_colon(draw, LEFT_W+int(50*SCALE), y, "কানযুল ঈমান থেকে অনুবাদ", "", f_kanzul, (20,40,120))
              y+=int(75*SCALE)

              for i,line in enumerate(bn_lines):
                  words=line.split()
                  is_last=i==len(bn_lines)-1
                  if not is_last and len(words)>1:
                      base_w=sum(draw.textlength(w, font=f_bn) for w in words) + draw.textlength(" ", font=f_bn)*(len(words)-1)
                      extra=max_w-base_w
                      gap=extra/(len(words)-1) if len(words)>1 else 0
                      if 0 < gap < 70*SCALE:
                          tx=LEFT_W+int(50*SCALE)
                          for w in words:
                              draw.text((tx,y), w, font=f_bn, fill=(15,25,85))
                              tx+=draw.textlength(w, font=f_bn)+draw.textlength(" ", font=f_bn)+gap
                      else:
                          draw.text((LEFT_W+int(50*SCALE), y), line, font=f_bn, fill=(15,25,85))
                  else:
                      draw.text((LEFT_W+int(50*SCALE), y), line, font=f_bn, fill=(15,25,85))
                  y+=int(cur_bn_size*SCALE*LH_BN)

              bg.save(os.path.join(OUT, filename), "JPEG", quality=95, subsampling=0)
              status = "HEADER (No Ayat)" if is_header else f"AR {cur_ar_size}dp, BN {cur_bn_size}dp"
              print(f"[{n}/{total}] Done {filename} with {status}, start_y={start_y}")

          print(f"Finished: {total} image(s) generated in '{OUT}/'.")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayah-images
          path: output/
          retention-days: 7

      - name: Push output
        env:
          ARABIC_NAME: ${{ inputs.arabic_name }}
          BANGLA_NAME: ${{ inputs.bangla_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          COUNT=$(find output -type f -name '*.jpg' | wc -l)
          COMMIT_MSG="chore: generate ${COUNT} ayah image(s) for ${ARABIC_NAME} / ${BANGLA_NAME}"

          git add -f output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "$COMMIT_MSG"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
