name: Generate Ayah Images

on:
  workflow_dispatch:
    inputs:
      arabic_name:
        description: 'আরবি সূরার নাম (উপরে থাকবে)'
        required: true
        type: string
      bangla_name:
        description: 'বাংলা সূরার নাম (নিচে থাকবে)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install Pillow

      - name: Generate Fixed Images
        env:
          ARABIC_NAME: ${{ inputs.arabic_name }}
          BANGLA_NAME: ${{ inputs.bangla_name }}
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json, os, re, shutil

          BG="src/background.jpg"
          LOGO="src/logo.jpg"
          DATA="src/data.json"
          OUT="output"
          FONT_BN="src/solaimanlipi.ttf"
          FONT_AR="src/noorehuda.ttf"

          # FIX: কিছু আরবি ফন্টে (যেমন noorehuda.ttf) কুরআনের উসমানী স্ক্রিপ্টে
          # ব্যবহৃত "ওয়াসলা-যুক্ত আলিফ" (ٱ, U+0671) এর গ্লিফ থাকে না, ফলে সেটা
          # ফাঁকা/অদৃশ্য রেন্ডার হয় (যেমন ٱللَّهِ থেকে আলিফ বাদ পড়া)। তাই শুধু
          # ছবি বানানোর সময় (data.json এর মূল ডেটা অপরিবর্তিত রেখে) সেটাকে
          # সাধারণ আলিফ (ا, U+0627) দিয়ে প্রতিস্থাপন করা হচ্ছে, যা প্রায় সব
          # আরবি ফন্টেই সাপোর্টেড।
          def normalize_arabic_display(text):
              return text.replace('\u0671', '\u0627')

          AR_NAME=normalize_arabic_display(os.environ.get("ARABIC_NAME","").strip())
          BN_NAME=os.environ.get("BANGLA_NAME","").strip()
          print(f"ARABIC_NAME={AR_NAME!r}, BANGLA_NAME={BN_NAME!r}")

          if os.path.exists(OUT):
              shutil.rmtree(OUT)
          os.makedirs(OUT, exist_ok=True)

          EN_TO_BN=str.maketrans("0123456789","০১২৩৪৫৬৭৮৯")
          def to_bangla_num(s): return str(s).translate(EN_TO_BN)
          def extract_number(s):
              s=str(s).translate(str.maketrans("০১২৩৪৫৬৭৮৯","0123456789"))
              m=re.search(r'\d+',s)
              return int(m.group()) if m else 0
          def clean_name(text):
              text = re.sub(r'\s*\(\s*[0-9০-৯]+\s*\)', '', text)
              return re.sub(r'\s{2,}', ' ', text).strip()

          W,H=3840,2160
          bg_img=Image.open(BG).convert("RGB") if os.path.exists(BG) else Image.new("RGB",(W,H),(232,236,244))
          W,H=bg_img.size

          LEFT_W=int(W*0.22)
          SCALE=W/1280
          print(f"BG Size: {W}x{H}, SCALE: {SCALE}, LEFT_W: {LEFT_W}")

          def get_font_by_size(is_ar, px_size):
              p=FONT_AR if is_ar else FONT_BN
              try: return ImageFont.truetype(p, int(px_size))
              except: return ImageFont.load_default()
          def get_font(is_ar, dp):
              return get_font_by_size(is_ar, dp*SCALE)

          with open(DATA, encoding="utf-8") as f:
              data=json.load(f)

          BASE_SURA=40
          BASE_DETAILS_AR=68
          BASE_DETAILS_BN=68
          BASE_KANZUL=42
          BASE_BN=52
          BASE_AR=80

          SURA_Y=int(300*SCALE)
          AYAT_Y=SURA_Y + int(BASE_SURA*SCALE*1.6)
          LINE_Y=AYAT_Y + int(BASE_SURA*SCALE*1.6)
          # বিসমিল্লাহ (আয়াত ০) এর ক্ষেত্রে "আয়াত" লাইনটা দেখানো হবে না, তাই
          # সেই ক্ষেত্রে ডিভাইডার লাইনটা এক ধাপ উপরে (আয়াতের জন্য বরাদ্দ জায়গা
          # বাদ দিয়ে) বসবে, যাতে খালি জায়গা না থাকে।
          LINE_Y_NO_AYAT=SURA_Y + int(BASE_SURA*SCALE*1.6)

          BOTTOM_MARGIN_DP = 5
          BOTTOM_MARGIN = int(BOTTOM_MARGIN_DP * SCALE)
          TOP_MARGIN = int(120*SCALE)

          SIDE_MARGIN=int(30*SCALE)
          AVAIL_W_NAMES = LEFT_W - 2*SIDE_MARGIN
          DETAILS_FLOOR=32
          GAP_Y_DETAILS=int(22*SCALE)

          _dummy_draw=ImageDraw.Draw(Image.new("RGB",(10,10)))
          temp_DET=72
          while True:
              f_ar_det=get_font_by_size(True, temp_DET*SCALE)
              f_bn_det=get_font_by_size(False, temp_DET*SCALE)
              AR_NAME_W=_dummy_draw.textlength(AR_NAME, font=f_ar_det)
              BN_NAME_W=_dummy_draw.textlength(BN_NAME, font=f_bn_det)
              if max(AR_NAME_W, BN_NAME_W) <= AVAIL_W_NAMES or temp_DET <= DETAILS_FLOOR:
                  BASE_DETAILS_AR=temp_DET
                  BASE_DETAILS_BN=temp_DET
                  break
              temp_DET -= 2

          def draw_label_colon(draw, x, y, label, value, font, fill):
              draw.text((x, y), label, font=font, fill=fill)
              label_w = draw.textlength(label, font=font)
              colon_up = int(font.size * 0.12)
              draw.text((x+label_w, y-colon_up), ":", font=font, fill=fill)
              colon_w = draw.textlength(":", font=font)
              if value:
                  draw.text((x+label_w+colon_w, y), " "+value, font=font, fill=fill)

          def draw_centered_label_colon(draw, y, label, value, font, fill):
              label_w = draw.textlength(label, font=font)
              colon_w = draw.textlength(":", font=font)
              value_w = draw.textlength(" "+value, font=font) if value else 0
              total_w = label_w + colon_w + value_w
              start_x = (LEFT_W - total_w) // 2
              draw.text((start_x, y), label, font=font, fill=fill)
              colon_up = int(font.size * 0.12)
              draw.text((start_x+label_w, y-colon_up), ":", font=font, fill=fill)
              if value:
                  draw.text((start_x+label_w+colon_w, y), " "+value, font=font, fill=fill)

          # বিসমিল্লাহ (verses == 0) এর ক্ষেত্রে আয়াত সংখ্যা "০০" না দেখিয়ে
          # শুধু "০" দেখানো হতো, কিন্তু এখন verses==0 হলে আয়াত লাইনটাই আঁকা
          # হবে না (নিচে দেখুন), তাই এই ফাংশন শুধু সূরা নম্বরের জন্য ব্যবহৃত হয়।
          def disp(n):
              if n == 0:
                  return "0"
              return f"0{n}" if n < 10 else str(n)

          for item in data:
              sura_int=extract_number(item.get('sura','0'))
              ayat_int=extract_number(item.get('verses','0'))
              filename=f"{sura_int:03d}{ayat_int:03d}.jpg"

              sura_disp=to_bangla_num(disp(sura_int))
              ayat_disp=to_bangla_num(disp(ayat_int))
              show_ayat = ayat_int != 0

              # এই আইটেমের জন্য ডিভাইডার লাইন ও তার নিচের ব্লকের Y পজিশন
              # নির্ধারণ — আয়াত লাইন না থাকলে এক ধাপ উপরে বসবে।
              line_y = LINE_Y if show_ayat else LINE_Y_NO_AYAT
              names_y = line_y + int(55*SCALE)

              bg=bg_img.resize((W,H), Image.LANCZOS)
              draw=ImageDraw.Draw(bg)
              draw.rectangle([0,0,LEFT_W,H], fill=(214,218,228))
              draw.line([(LEFT_W,0),(LEFT_W,H)], fill=(35,45,85), width=int(4*SCALE))

              if os.path.exists(LOGO):
                  try:
                      ls=int(200*SCALE)
                      logo=Image.open(LOGO).convert("RGBA").resize((ls,ls), Image.LANCZOS)
                      bg.paste(logo,(int((LEFT_W-ls)//2), int(30*SCALE)), logo)
                  except: pass

              f_sura=get_font(False, BASE_SURA)
              f_kanzul=get_font(False, BASE_KANZUL)
              max_w=W-LEFT_W-int(140*SCALE)

              # আরবি আয়াত যেন কোনো অবস্থাতেই ক্যানভাসের বাইরে গিয়ে কাটা/বাদ না
              # পড়ে, তাই ব্লকের উচ্চতার পাশাপাশি প্রতিটি লাইনের প্রস্থও (line
              # width) max_w এর মধ্যে আছে কিনা যাচাই করা হচ্ছে। কোনো একক শব্দ
              # (দীর্ঘ যুক্তবর্ণ/হারাকাতযুক্ত) নিজেই max_w এর চেয়ে চওড়া হলে আগে
              # তা ধরা পড়ত না — এখন ফন্ট আরও ছোট করে (ফ্লোর পর্যন্ত) নিশ্চিত
              # করা হচ্ছে কোনো লাইন সীমার বাইরে গিয়ে কাটা পড়বে না।
              temp_AR = BASE_AR
              while True:
                  f_ar=get_font(True, temp_AR)
                  arabic_raw=normalize_arabic_display(item.get('names','').strip())
                  arabic_lines=[]
                  cur=""
                  for w in arabic_raw.split():
                      test=f"{cur} {w}".strip()
                      if draw.textlength(test, font=f_ar) <= max_w:
                          cur=test
                      else:
                          if cur: arabic_lines.append(cur)
                          cur=w
                  if cur: arabic_lines.append(cur)

                  line_widths = [draw.textlength(line, font=f_ar) for line in arabic_lines]
                  max_line_w = max(line_widths) if line_widths else 0

                  ar_block_h = len(arabic_lines) * int(temp_AR*SCALE*1.5)
                  fits_height = ar_block_h <= (H - int(200*SCALE)) * 0.55
                  fits_width = max_line_w <= max_w

                  if (fits_height and fits_width) or temp_AR <= 50:
                      BASE_AR = temp_AR
                      break
                  temp_AR -= 2

              temp_BN = BASE_BN
              while True:
                  f_bn=get_font(False, temp_BN)
                  cleaned=clean_name(item.get('name',''))
                  bn_lines=[]
                  cur=""
                  for w in cleaned.split():
                      test=f"{cur} {w}".strip()
                      if draw.textlength(test, font=f_bn) <= max_w:
                          cur=test
                      else:
                          if cur: bn_lines.append(cur)
                          cur=w
                  if cur: bn_lines.append(cur)
                  needed = len(arabic_lines)*int(BASE_AR*SCALE*1.5) + int(50*SCALE) + int(75*SCALE) + len(bn_lines)*int(temp_BN*SCALE*1.45)
                  if needed < H - TOP_MARGIN - BOTTOM_MARGIN or temp_BN <= 30:
                      BASE_BN = temp_BN
                      break
                  temp_BN -= 2

              f_bn=get_font(False, BASE_BN)

              arabic_block_h = len(arabic_lines) * int(BASE_AR*SCALE*1.5)
              gap_after_arabic = int(50*SCALE)
              kanzul_block_h = int(75*SCALE)
              bn_block_h = len(bn_lines) * int(BASE_BN*SCALE*1.4)
              total_block_h = arabic_block_h + gap_after_arabic + kanzul_block_h + bn_block_h

              start_y = max(TOP_MARGIN, (H - total_block_h - BOTTOM_MARGIN) // 2)
              if start_y + total_block_h + BOTTOM_MARGIN > H:
                  start_y = H - total_block_h - BOTTOM_MARGIN

              draw_centered_label_colon(draw, SURA_Y, "সূরা", sura_disp, f_sura, (0,0,0))
              if show_ayat:
                  draw_centered_label_colon(draw, AYAT_Y, "আয়াত", ayat_disp, f_sura, (0,0,0))
              draw.line([(int(40*SCALE), line_y), (int(LEFT_W-40*SCALE), line_y)], fill=(100,100,120), width=2)

              f_ar_det=get_font_by_size(True, BASE_DETAILS_AR*SCALE)
              f_bn_det=get_font_by_size(False, BASE_DETAILS_BN*SCALE)
              ar_w = draw.textlength(AR_NAME, font=f_ar_det)
              bn_w = draw.textlength(BN_NAME, font=f_bn_det)
              ar_x = (LEFT_W - ar_w)//2
              bn_x = (LEFT_W - bn_w)//2
              dy = names_y
              draw.text((ar_x, dy), AR_NAME, font=f_ar_det, fill=(20,20,60))
              dy += int(BASE_DETAILS_AR*SCALE*1.6) + GAP_Y_DETAILS
              draw.text((bn_x, dy), BN_NAME, font=f_bn_det, fill=(20,20,60))

              y=start_y
              for line in arabic_lines:
                  w=draw.textlength(line, font=f_ar)
                  draw.text((W-int(70*SCALE)-w, y), line, font=f_ar, fill=(0,0,0))
                  y+=int(BASE_AR*SCALE*1.5)

              y+=int(50*SCALE)
              draw_label_colon(draw, LEFT_W+int(50*SCALE), y, "কানযুল ঈমান থেকে অনুবাদ", "", f_kanzul, (20,40,120))
              y+=int(75*SCALE)

              for i,line in enumerate(bn_lines):
                  words=line.split()
                  is_last=i==len(bn_lines)-1
                  if not is_last and len(words)>1:
                      base_w=sum(draw.textlength(w, font=f_bn) for w in words) + draw.textlength(" ", font=f_bn)*(len(words)-1)
                      extra=max_w-base_w
                      gap=extra/(len(words)-1) if len(words)>1 else 0
                      if 0 < gap < 70*SCALE:
                          tx=LEFT_W+int(50*SCALE)
                          for w in words:
                              draw.text((tx,y), w, font=f_bn, fill=(15,25,85))
                              tx+=draw.textlength(w, font=f_bn)+draw.textlength(" ", font=f_bn)+gap
                      else:
                          draw.text((LEFT_W+int(50*SCALE), y), line, font=f_bn, fill=(15,25,85))
                  else:
                      draw.text((LEFT_W+int(50*SCALE), y), line, font=f_bn, fill=(15,25,85))
                  y+=int(BASE_BN*SCALE*1.4)

              bg.save(os.path.join(OUT, filename), "JPEG", quality=95, subsampling=0)
              print(f"Done {filename} with AR {BASE_AR}dp, BN {BASE_BN}dp, start_y={start_y}, show_ayat={show_ayat}")

          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayah-images
          path: output/
          retention-days: 7

      - name: Push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          git commit -m "fix: normalize alef wasla for font glyph support + hide ayat line for bismillah" || echo "no changes"
          git push
