name: Generate Ayah Images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install Pillow

      - name: Generate Fixed Images
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json, os, re, shutil

          BG="src/background.jpg"
          LOGO="src/logo.jpg"
          DATA="src/data.json"
          DETAILS="src/details.txt"
          OUT="output"
          FONT_BN="src/solaimanlipi.ttf"
          FONT_AR="src/noorehuda.ttf"

          # পুরানো output ডিলিট - যাতে নতুন ছবি ১০০% বানায়
          if os.path.exists(OUT):
              shutil.rmtree(OUT)
          os.makedirs(OUT, exist_ok=True)

          EN_TO_BN=str.maketrans("0123456789","০১২৩৪৫৬৭৮৯")
          def to_bangla_num(s): return str(s).translate(EN_TO_BN)
          def extract_number(s):
              s=str(s).translate(str.maketrans("০১২৩৪৫৬৭৮৯","0123456789"))
              m=re.search(r'\d+',s)
              return int(m.group()) if m else 0
          def clean_name(text):
              text = re.sub(r'\s*\(\s*[0-9০-৯]+\s*\)', '', text)
              return re.sub(r'\s{2,}', ' ', text).strip()

          W,H=3840,2160
          bg_img=Image.open(BG).convert("RGB") if os.path.exists(BG) else Image.new("RGB",(W,H),(232,236,244))
          W,H=bg_img.size

          LEFT_W=int(W*0.22)
          SCALE=W/1280
          print(f"BG Size: {W}x{H}, SCALE: {SCALE}, LEFT_W: {LEFT_W}")

          def get_font_by_size(is_ar, px_size):
              p=FONT_AR if is_ar else FONT_BN
              try: return ImageFont.truetype(p, int(px_size))
              except: return ImageFont.load_default()
          def get_font(is_ar, dp):
              return get_font_by_size(is_ar, dp*SCALE)

          details_map={}
          if os.path.exists(DETAILS):
              with open(DETAILS, encoding="utf-8") as f:
                  lines=[l.strip() for l in f if l.strip()]
              print(f"DETAILS.TXT lines: {len(lines)}")
              for i in range(0,len(lines),2):
                  k=str((i//2)+1).zfill(3)
                  details_map[k]={"ar":lines[i],"bn":lines[i+1] if i+1<len(lines) else ""}
          print(f"Details map: {details_map}")

          with open(DATA, encoding="utf-8") as f:
              data=json.load(f)

          for item in data:
              sura_int=extract_number(item.get('sura','0'))
              ayat_int=extract_number(item.get('verses','0'))
              s_no=extract_number(item.get('sura_no_en',sura_int))
              filename=f"{sura_int:03d}{ayat_int:03d}.jpg"

              def disp(n): return f"0{n}" if n<10 else str(n)
              sura_disp=to_bangla_num(disp(sura_int))
              ayat_disp=to_bangla_num(disp(ayat_int))

              bg=bg_img.resize((W,H), Image.LANCZOS)
              draw=ImageDraw.Draw(bg)
              draw.rectangle([0,0,LEFT_W,H], fill=(214,218,228))
              draw.line([(LEFT_W,0),(LEFT_W,H)], fill=(35,45,85), width=int(4*SCALE))

              if os.path.exists(LOGO):
                  try:
                      ls=int(200*SCALE)
                      logo=Image.open(LOGO).convert("RGBA").resize((ls,ls), Image.LANCZOS)
                      bg.paste(logo,(int((LEFT_W-ls)//2), int(30*SCALE)), logo)
                  except: pass

              # === তোমার চাওয়া মতো 22dp ===
              BASE_SURA=22
              BASE_DETAILS_AR=22
              BASE_DETAILS_BN=22
              BASE_KANZUL=42
              BASE_BN=52 # বাংলা বড়, যাতে কাটার আগে শ্রিঙ্ক হয়
              BASE_AR=62

              f_sura=get_font(False, BASE_SURA)
              f_kanzul=get_font(False, BASE_KANZUL)
              max_w=W-LEFT_W-int(140*SCALE)

              # Arabic
              f_ar=get_font(True, BASE_AR)
              arabic_raw=item.get('names','').strip()
              arabic_lines=[]
              cur=""
              for w in arabic_raw.split():
                  test=f"{cur} {w}".strip()
                  if draw.textlength(test, font=f_ar) <= max_w:
                      cur=test
                  else:
                      if cur: arabic_lines.append(cur)
                      cur=w
              if cur: arabic_lines.append(cur)

              # Bangla - auto shrink যাতে না কাটে
              temp_BN = BASE_BN
              while True:
                  f_bn=get_font(False, temp_BN)
                  cleaned=clean_name(item.get('name',''))
                  bn_lines=[]
                  cur=""
                  for w in cleaned.split():
                      test=f"{cur} {w}".strip()
                      if draw.textlength(test, font=f_bn) <= max_w:
                          cur=test
                      else:
                          if cur: bn_lines.append(cur)
                          cur=w
                  if cur: bn_lines.append(cur)
                  needed = int(350*SCALE) + len(arabic_lines)*int(BASE_AR*SCALE*1.5) + 120*SCALE + len(bn_lines)*int(temp_BN*SCALE*1.45)
                  if needed < H - 80*SCALE or temp_BN <= 30:
                      BASE_BN = temp_BN
                      break
                  temp_BN -= 2

              f_bn=get_font(False, BASE_BN)

              # Sura Ayat 22dp
              draw.text((int(40*SCALE), int(320*SCALE)), f"সূরা: {sura_disp}", font=f_sura, fill=(0,0,0))
              draw.text((int(40*SCALE), int(370*SCALE)), f"আয়াত: {ayat_disp}", font=f_sura, fill=(0,0,0))
              draw.line([(int(40*SCALE), int(430*SCALE)), (int(LEFT_W-40*SCALE), int(430*SCALE))], fill=(100,100,120), width=2)

              # DETAILS - 90° Arabic উপরে, Bangla নিচে - 22dp সব ছবিতে
              info=details_map.get(f"{s_no:03d}", details_map.get("001"))
              if info:
                  ar_txt=info.get('ar','')
                  bn_txt=info.get('bn','')
                  f_ar_det=get_font_by_size(True, BASE_DETAILS_AR*SCALE)
                  f_bn_det=get_font_by_size(False, BASE_DETAILS_BN*SCALE)

                  ar_w=int(draw.textlength(ar_txt, font=f_ar_det)+100*SCALE)
                  tmp_ar=Image.new("RGBA",(ar_w, int(90*SCALE)), (0,0,0,0))
                  ImageDraw.Draw(tmp_ar).text((0,15), ar_txt, font=f_ar_det, fill=(20,20,60,255))
                  rot_ar=tmp_ar.rotate(90, expand=True)

                  bn_w=int(draw.textlength(bn_txt, font=f_bn_det)+100*SCALE)
                  tmp_bn=Image.new("RGBA",(bn_w, int(90*SCALE)), (0,0,0,0))
                  ImageDraw.Draw(tmp_bn).text((0,15), bn_txt, font=f_bn_det, fill=(20,20,60,255))
                  rot_bn=tmp_bn.rotate(90, expand=True)

                  ry=int(480*SCALE)
                  bg.paste(rot_ar, (int((LEFT_W-rot_ar.width)//2), ry), rot_ar)
                  ry+=rot_ar.height+int(30*SCALE)
                  bg.paste(rot_bn, (int((LEFT_W-rot_bn.width)//2), ry), rot_bn)

              y=int(350*SCALE)
              for line in arabic_lines:
                  w=draw.textlength(line, font=f_ar)
                  draw.text((W-int(70*SCALE)-w, y), line, font=f_ar, fill=(0,0,0))
                  y+=int(BASE_AR*SCALE*1.5)

              y+=int(50*SCALE)
              draw.text((LEFT_W+int(50*SCALE), y), "কানযুল ঈমান থেকে অনুবাদ:", font=f_kanzul, fill=(20,40,120))
              y+=int(75*SCALE)

              for i,line in enumerate(bn_lines):
                  words=line.split()
                  is_last=i==len(bn_lines)-1
                  if not is_last and len(words)>1:
                      base_w=sum(draw.textlength(w, font=f_bn) for w in words) + draw.textlength(" ", font=f_bn)*(len(words)-1)
                      extra=max_w-base_w
                      gap=extra/(len(words)-1) if len(words)>1 else 0
                      if 0 < gap < 70*SCALE:
                          tx=LEFT_W+int(50*SCALE)
                          for w in words:
                              draw.text((tx,y), w, font=f_bn, fill=(15,25,85))
                              tx+=draw.textlength(w, font=f_bn)+draw.textlength(" ", font=f_bn)+gap
                      else:
                          draw.text((LEFT_W+int(50*SCALE), y), line, font=f_bn, fill=(15,25,85))
                  else:
                      draw.text((LEFT_W+int(50*SCALE), y), line, font=f_bn, fill=(15,25,85))
                  y+=int(BASE_BN*SCALE*1.4)

              bg.save(os.path.join(OUT, filename), "JPEG", quality=95, subsampling=0)
              print(f"Done {filename} with BN {BASE_BN}dp")

          PY

      - name: Push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          git commit -m "force rebuild all images - fix cut and details 22dp" || echo "no changes"
          git push
