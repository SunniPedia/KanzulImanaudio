name: Download Surah - Alafasay

on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'সূরার নম্বর লিখো (1-114)'
        required: true
        default: '1'
        type: string
      qari:
        description: 'Qari folder name'
        required: false
        default: 'Alafasy_128kbps'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create folder structure
        run: |
          mkdir -p Audio/alafasy/128

      - name: Download Selected Surah
        run: |
          SURAH_NUM=${{ inputs.surah_number }}
          QARI="${{ inputs.qari }}"
          BASE_URL="https://everyayah.com/data/$QARI"
          DEST_DIR="Audio/alafasy/128"

          # 114 টা সূরার আয়াত সংখ্যা
          AYAH_COUNTS=(0 7 286 200 176 120 165 206 75 129 109 123 111 43 52 99 128 111 110 98 135 112 78 118 64 77 227 93 88 69 60 34 30 73 54 45 83 182 88 75 85 54 53 89 59 37 35 38 29 18 45 60 49 62 55 78 96 29 22 24 13 14 11 11 18 12 12 30 52 52 44 28 28 20 56 40 31 50 40 46 42 29 19 36 25 22 17 19 26 30 20 15 21 11 8 8 19 5 8 8 11 11 8 3 9 5 4 7 3 6 3 5 4 5 6)

          if ! [[ "$SURAH_NUM" =~ ^[0-9]+$ ]] || [ "$SURAH_NUM" -lt 1 ] || [ "$SURAH_NUM" -gt 114 ]; then
            echo "Error: Surah number must be between 1 and 114"
            exit 1
          fi

          TOTAL_AYAH=${AYAH_COUNTS[$SURAH_NUM]}
          SURAH_PAD=$(printf "%03d" $SURAH_NUM)

          echo "Downloading Surah $SURAH_NUM (Total Ayahs: $TOTAL_AYAH) from $QARI..."

          for ayah in $(seq 1 $TOTAL_AYAH); do
            AYAH_PAD=$(printf "%03d" $ayah)
            FILE_NAME="${SURAH_PAD}${AYAH_PAD}.mp3"
            URL="$BASE_URL/$FILE_NAME"
            DEST_PATH="$DEST_DIR/$FILE_NAME"

            echo "Downloading $URL -> $DEST_PATH"
            curl -L --fail --retry 3 -o "$DEST_PATH" "$URL"
            sleep 0.5
          done

          echo "Done! Files:"
          ls -lh $DEST_DIR/ | grep $SURAH_PAD

      - name: Commit and Push Audio Files
        run: |
          SURAH_NUM=${{ inputs.surah_number }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Audio/
          git diff --staged --quiet || git commit -m "Add Surah $SURAH_NUM - Alafasy 128kbps"
          git push
