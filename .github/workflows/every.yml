name: Download Surah Fatiha - Alafasy

on:
  workflow_dispatch: # তুমি নিজে Run বাটন চাপলে চলবে

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ফাইল সেইভ করে commit করার জন্য

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create folder structure
        run: |
          mkdir -p Audio/alafasy/128

      - name: Download Fatiha Ayahs (001001 to 001007)
        run: |
          QARI="Alafasy_128kbps"
          BASE_URL="https://everyayah.com/data/$QARI"
          DEST_DIR="Audio/alafasy/128"

          echo "Downloading Surah Al-Fatiha..."

          for ayah in {1..7}; do
            # 001001, 001002... এই ফরম্যাট বানানো
            FILE_NAME=$(printf "001%03d.mp3" $ayah)
            URL="$BASE_URL/$FILE_NAME"
            DEST_PATH="$DEST_DIR/$FILE_NAME"

            echo "Downloading $URL -> $DEST_PATH"
            curl -L --fail --retry 3 -o "$DEST_PATH" "$URL"

            # একটু delay যাতে সাইট ব্লক না করে
            sleep 1
          done

          echo "Done! Files:"
          ls -lh $DEST_DIR/

      - name: Commit and Push Audio Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Audio/
          git diff --staged --quiet || git commit -m "Add Surah Fatiha - Alafasy 128kbps [001001-001007]"
          git push
