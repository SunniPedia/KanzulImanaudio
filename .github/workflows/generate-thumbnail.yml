name: Generate Surah Thumbnail

on:
  workflow_dispatch:
    inputs:
      surah_ar:
        description: "সূরার নাম (আরবি) — যেমন: سورة الفاتحة"
        required: true
        type: string
      surah_bn:
        description: "সূরার নাম (বাংলা) — যেমন: সূরা আল-ফাতিহা"
        required: true
        type: string
      surah_no:
        description: "সূরা নম্বর (ঐচ্ছিক)"
        required: false
        default: ""
        type: string
      commit_result:
        description: "রিপোজটরিতে কমিট করবেন?"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  thumbnail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Download calligraphy font (Aref Ruqaa, OFL)
        run: |
          mkdir -p src
          [ -s src/ArefRuqaa-Bold.ttf ] || curl -fsSL -o src/ArefRuqaa-Bold.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf \
            || echo "font download failed, fallback to noorehuda"

      - name: Generate thumbnail
        env:
          SURAH_AR: ${{ inputs.surah_ar }}
          SURAH_BN: ${{ inputs.surah_bn }}
          SURAH_NO: ${{ inputs.surah_no }}
        run: |
          python - <<'PY'
          import os, html, pathlib
          from playwright.sync_api import sync_playwright

          ROOT = pathlib.Path.cwd()
          SRC = ROOT / "src"
          BN = str.maketrans("0123456789", "০১২৩৪৫৬৭৮৯")

          TEMPLATE = """<!doctype html>
          <html lang="bn"><head><meta charset="utf-8">
          <style>
          @font-face { font-family:'Noor';  src:url('file://__SRC__/noorehuda.ttf'); }
          @font-face { font-family:'Calli'; src:url('file://__SRC__/ArefRuqaa-Bold.ttf'); }
          @font-face { font-family:'Solai'; src:url('file://__SRC__/solaimanlipi.ttf'); }
          :root{ --green:#0b5d3b; --green-d:#073d27; --gold:#b8892f; --gold-l:#e2bf6a; --ink:#1b2a41; }
          *{ margin:0; padding:0; box-sizing:border-box; }
          html,body{ width:1920px; height:1080px; overflow:hidden; }
          body{
            background:url('file://__SRC__/background.jpg') center/cover no-repeat;
            position:relative; font-family:'Solai',sans-serif; color:var(--ink);
          }
          /* ফ্রেম */
          .frame{ position:absolute; inset:34px; border:3px solid var(--gold); border-radius:6px; }
          .frame::after{ content:''; position:absolute; inset:10px; border:1px solid rgba(184,137,47,.55); border-radius:3px; }

          /* বাম: লোগো */
          .left{ position:absolute; left:90px; top:0; bottom:0; width:560px;
            display:flex; flex-direction:column; align-items:center; justify-content:center; }
          .logo-wrap{ width:500px; height:500px; border-radius:36px; background:#fff;
            border:6px solid var(--gold); box-shadow:0 18px 50px rgba(11,93,59,.22), inset 0 0 0 10px #fff;
            display:flex; align-items:center; justify-content:center; overflow:hidden; }
          .logo-wrap img{ width:100%; height:100%; object-fit:contain; }

          /* ডিভাইডার */
          .divider{ position:absolute; left:720px; top:150px; bottom:150px; width:3px;
            background:linear-gradient(transparent,var(--gold) 20%,var(--gold) 80%,transparent); }

          /* ডান: লেখা */
          .right{ position:absolute; left:790px; right:90px; top:0; bottom:0;
            display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
          .quran{ font-family:'Calli','Noor'; font-size:200px; line-height:1.6; font-weight:700; color:var(--green);
            text-shadow:0 4px 0 rgba(226,191,106,.55); direction:rtl; }
          .quran-bn{ font-size:58px; color:var(--gold); margin-top:-12px; letter-spacing:2px; }
          .ornament{ width:520px; height:3px; margin:26px 0 30px;
            background:linear-gradient(90deg,transparent,var(--gold),transparent); position:relative; }
          .ornament::after{ content:'✦'; position:absolute; left:50%; top:50%; transform:translate(-50%,-52%);
            background:transparent; color:var(--gold); font-size:30px; padding:0 14px; background:#eef1fa; }
          .card{ width:100%; padding:26px 30px 34px; border-radius:26px;
            background:linear-gradient(135deg,var(--green),var(--green-d));
            box-shadow:0 14px 40px rgba(7,61,39,.35); border:3px solid var(--gold); position:relative; }
          .num{ position:absolute; top:-40px; right:36px; width:84px; height:84px; border-radius:50%;
            background:var(--gold); color:#fff; font-size:40px; display:__NUMDISP__;
            align-items:center; justify-content:center; border:5px solid #fff; box-shadow:0 6px 16px rgba(0,0,0,.25); }
          .s-ar{ font-family:'Noor'; font-size:150px; line-height:1.55; color:#fff; direction:rtl; }
          .s-bn{ font-size:86px; line-height:1.25; color:var(--gold-l); margin-top:-6px; }
          .tarjuma{ margin-top:38px; display:inline-block; padding:12px 44px; border-radius:60px;
            font-size:50px; color:var(--green-d); background:linear-gradient(90deg,#f3dc9c,#e2bf6a,#f3dc9c);
            border:2px solid var(--gold); box-shadow:0 6px 16px rgba(184,137,47,.35); }
          </style></head>
          <body>
            <div class="frame"></div>
            <div class="left">
              <div class="logo-wrap"><img src="file://__SRC__/logo.jpg"></div>
            </div>
            <div class="divider"></div>
            <div class="right">
              <div class="quran">القرآن الكريم</div>
              <div class="quran-bn">আল কুরআন</div>
              <div class="ornament"></div>
              <div class="card">
                <div class="num">__NUM__</div>
                <div class="s-ar">__AR__</div>
                <div class="s-bn">__BN__</div>
              </div>
              <div class="tarjuma">তরজুমায়ে কানযুল ঈমান</div>
            </div>
          </body></html>"""

          ar  = os.environ["SURAH_AR"]
          bn  = os.environ["SURAH_BN"]
          num = os.environ.get("SURAH_NO", "").strip().translate(BN)   # বাংলা সংখ্যা

          page_html = (TEMPLATE
              .replace("__SRC__", SRC.as_posix())
              .replace("__AR__", html.escape(ar))
              .replace("__BN__", html.escape(bn))
              .replace("__NUM__", html.escape(num))
              .replace("__NUMDISP__", "flex" if num else "none"))

          out = ROOT / "output" / "thumbnail.png"
          out.parent.mkdir(parents=True, exist_ok=True)
          tmp = ROOT / "output" / "_thumb.html"
          tmp.write_text(page_html, encoding="utf-8")

          with sync_playwright() as pw:
              b = pw.chromium.launch(args=["--allow-file-access-from-files"])
              pg = b.new_page(viewport={"width": 1920, "height": 1080}, device_scale_factor=2)  # 3840x2160 (4K)
              pg.goto(tmp.as_uri())
              pg.evaluate("document.fonts.ready")
              pg.wait_for_timeout(500)
              pg.screenshot(path=str(out), type="png")
              b.close()
          tmp.unlink(missing_ok=True)
          print("saved:", out)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: surah-thumbnail
          path: output/thumbnail.png

      - name: Commit thumbnail
        if: ${{ inputs.commit_result }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/thumbnail.png
          git diff --cached --quiet || git commit -m "chore: update surah thumbnail [skip ci]"
          git push
