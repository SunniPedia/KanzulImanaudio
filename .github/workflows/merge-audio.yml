name: Merge and Save to Repo

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Merge Audios
        run: |
          mkdir -p kanzulImanAudio
          for arabic_file in Audio/alafasy/128/*.mp3; do
            file_name=$(basename "$arabic_file")
            bangla_file="audio/bangla/$file_name"
            output_file="kanzulImanAudio/$file_name"

            if [ -f "$bangla_file" ]; then
              echo "Merging $file_name"
              ffmpeg -y -i "$arabic_file" -i "$bangla_file" -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1[a]" -map "[a]" -b:a 128k "$output_file"
            else
              echo "Bangla not found for $file_name"
              cp "$arabic_file" "$output_file"
            fi
          done
          ls -lh kanzulImanAudio/

      - name: Upload Artifact (for quick download)
        uses: actions/upload-artifact@v4
        with:
          name: kanzulImanAudio
          path: kanzulImanAudio/

      - name: Push to Repository (এটাই Repo তে দেখাবে)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kanzulImanAudio/
          git commit -m "Add merged audio: kanzulImanAudio" || echo "Nothing to commit"
          git push
