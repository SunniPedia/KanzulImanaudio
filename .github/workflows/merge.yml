name: Merge Arabic + Bangla Audio - Fixed

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Debug Folders
        run: |
          echo "--- All folders ---"
          find. -type d | sort
          echo "--- Check Arabic ---"
          ls -R | grep -i alafasy -A 2 -B 2
          echo "--- Check Bangla ---"
          ls -R | grep -i bangla -A 2 -B 2

      - name: Merge Audios into kanzulImanAudio
        run: |
          ARABIC_DIR=$(find. -type d -path "*alafasy/128" | head -n 1)
          BANGLA_DIR=$(find. -type d -iname "bangla" | head -n 1)
          OUTPUT_DIR="kanzulImanAudio"

          echo "Found Arabic Dir: $ARABIC_DIR"
          echo "Found Bangla Dir: $BANGLA_DIR"

          if [ -z "$ARABIC_DIR" ]; then echo "ERROR: Arabic folder not found!"; exit 1; fi
          if [ -z "$BANGLA_DIR" ]; then echo "ERROR: Bangla folder not found!"; exit 1; fi

          mkdir -p "$OUTPUT_DIR"

          for arabic_file in "$ARABIC_DIR"/*.mp3; do
            [ -e "$arabic_file" ] || continue
            file_name=$(basename "$arabic_file")
            bangla_file="$BANGLA_DIR/$file_name"
            output_file="$OUTPUT_DIR/$file_name"

            if [ -f "$bangla_file" ]; then
              echo "MERGING: $file_name"
              ffmpeg -y -hide_banner -loglevel error -i "$arabic_file" -i "$bangla_file" -filter_complex "[0:a:0][1:a:0]concat=n=2:v=0:a=1[a]" -map "[a]" -ar 44100 -ac 2 -b:a 128k "$output_file"
            else
              echo "Bangla missing for $file_name"
              cp "$arabic_file" "$output_file"
            fi
          done

          ls -lh "$OUTPUT_DIR/"

      - name: Commit Merged Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kanzulImanAudio/
          git diff --staged --quiet || git commit -m "Fixed: Merged Arabic + Bangla"
          git push
