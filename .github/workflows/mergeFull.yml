name: Merge Ayat to Single Surah

on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'কোন সুরা মার্জ করবে? (যেমন: 001, 002, 114)'
        required: true
        default: '001'
        type: string
      output_folder:
        description: 'Output folder name'
        required: false
        default: 'rizwanFullSurah'
        type: string

jobs:
  merge-surah:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Merge Specific Surah Ayats into One File
        run: |
          INPUT_DIR="rizwanaudio"
          SURAH="${{ inputs.surah_number }}"
          OUTPUT_DIR="${{ inputs.output_folder }}"
          
          mkdir -p "$OUTPUT_DIR"

          echo "Looking for files like $INPUT_DIR/${SURAH}*.mp3"
          ls -1 $INPUT_DIR/${SURAH}*.mp3 | sort -V > file_list.txt
          
          if [ ! -s file_list.txt ]; then
            echo "No files found for Surah $SURAH"
            exit 1
          fi

          # FFmpeg concat list বানানো
          rm -f concat_list.txt
          while read f; do
            echo "file '$PWD/$f'" >> concat_list.txt
          done < file_list.txt

          OUTPUT_FILE="$OUTPUT_DIR/${SURAH}.mp3"
          echo "Merging to $OUTPUT_FILE"
          
          ffmpeg -y -f concat -safe 0 -i concat_list.txt -c:a libmp3lame -b:a 128k "$OUTPUT_FILE"
          
          ls -lh "$OUTPUT_DIR"/

      - name: Upload Merged Surah Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surah-${{ inputs.surah_number }}-Merged
          path: ${{ inputs.output_folder }}/

      - name: Commit to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ${{ inputs.output_folder }}/
          git commit -m "Merged Surah ${{ inputs.surah_number }}" || echo "No changes to commit"
          git push
