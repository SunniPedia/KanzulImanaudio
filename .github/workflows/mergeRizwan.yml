name: Merge Arabic + Bangla Rizwan

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Merge Audios
        run: |
          ARABIC_DIR="Audio/alafasy/128"
          BANGLA_DIR="Audio/bangla"
          OUTPUT_DIR="rizwanaudio"

          mkdir -p "$OUTPUT_DIR"

          for arabic_file in "$ARABIC_DIR"/*.mp3; do
            [ -e "$arabic_file" ] || continue
            file_name=$(basename "$arabic_file")
            bangla_file="$BANGLA_DIR/$file_name"
            output_file="$OUTPUT_DIR/$file_name"

            if [ -f "$bangla_file" ]; then
              echo "MERGING $file_name"
              ffmpeg -y -hide_banner -loglevel error -i "$arabic_file" -i "$bangla_file" -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1[a]" -map "[a]" -b:a 128k "$output_file"
            else
              cp "$arabic_file" "$output_file"
            fi
          done
          ls -lh "$OUTPUT_DIR"/

      - name: Upload Artifact (Download from here)
        uses: actions/upload-artifact@v4
        with:
          name: rizwanaudio-Merged
          path: rizwanaudio/

      - name: Force Commit to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Remove old folder if exists
          rm -rf kanzulImanAudio
          git rm -r --cached kanzulImanAudio || true

          git add -f rizwanaudio/
          git commit -m "Merged Arabic + Bangla Audio to rizwanaudio" || echo "No changes to commit"
          git push
