name: Full Surah Audio Merge (rizwanaudio আয়াত অডিও → rizwanFullSurah/<qari>/<সূরা>.mp3)

# =====================================================================
# কাজ: rizwanaudio/<qari>/<সূরা>/ এ থাকা আয়াতের অডিওগুলো ক্রমানুসারে জোড়া লাগিয়ে
#      পুরো সূরার একটি MP3 বানায়।
#
#   ইনপুট  : rizwanaudio/<qari>/001/000.mp3 (বিসমিল্লাহ, থাকলে), 001.mp3, 002.mp3 ...
#   আউটপুট : rizwanFullSurah/<qari>/001.mp3   (ফাইলের নাম = সূরা নম্বর)
#
# ক্রম: বিসমিল্লাহ (000.mp3, ফোল্ডারে থাকলে) সবার আগে, তারপর ১, ২, ৩ ... আয়াত।
# আয়াতের মাঝে কোনো বিরতি নেই (সরাসরি জোড়া)।
# ট্যাগ: ID3v1 + ID3v2 এর সব ফিল্ডে metadata_value (ডিফল্ট Rizwan)।
# ১০০ MB এর বেশি ফাইল Git LFS দিয়ে commit হয়, নইলে সাধারণ commit।
#
# surah_range ইনপুটের উদাহরণ:
#   1-114        → সব সূরা
#   5            → শুধু সূরা ৫
#   1-3,9,36-40  → মিশ্র (কমা দিয়ে আলাদা; বাংলা সংখ্যাও চলবে)
#
# audio_source (আগের মতোই):
#   both         → দুই সোর্সের জন্য দুটো job সমান্তরালে (আলাদা ফোল্ডারে)
#   everyayah    → শুধু everyayah  (rizwanFullSurah/alafasy/...)
#   dawateislami → শুধু dawateislami (rizwanFullSurah/dawateislami/...)
#
# যে সূরার rizwanaudio ফোল্ডার নেই সেটি বাদ যায় (warning সহ), বাকিগুলো চলে।
# =====================================================================

on:
  workflow_dispatch:
    inputs:
      surah_range:
        description: 'সূরার রেঞ্জ — যেমন: 1-114 (সব), 5 (একটি), 1-3,9,36-40 (মিশ্র)। বাংলা সংখ্যাও চলবে'
        required: true
        default: '1-114'
        type: string
      audio_source:
        description: 'কোন সোর্সের অডিও: both = দুটোই (সমান্তরালে) , everyayah , dawateislami'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - everyayah
          - dawateislami
      qari_folder:
        description: 'everyayah এর ক্বারী ফোল্ডারের নাম (ফাঁকা = alafasy)'
        required: false
        default: ''
        type: string
      dawateislami_folder:
        description: 'dawateislami এর ফোল্ডারের নাম (ফাঁকা = dawateislami)'
        required: false
        default: ''
        type: string
      audio_folder:
        description: 'ইনপুট ফোল্ডারের রুট (ভেতরে <qari>/<সূরা>/<আয়াত>.mp3)'
        required: false
        default: 'rizwanaudio'
        type: string
      output_folder:
        description: 'আউটপুট ফোল্ডারের রুট (ভেতরে <qari>/<সূরা>.mp3)'
        required: false
        default: 'rizwanFullSurah'
        type: string
      metadata_value:
        description: 'MP3 এর নতুন Tag (Title/Artist/Album ইত্যাদি)'
        required: false
        default: 'Rizwan'
        type: string
      commit_result:
        description: 'রিপোজিটরিতে commit করবেন? (বন্ধ থাকলে শুধু Artifact হবে)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  # =====================================================================
  # Job ১: কোন কোন সোর্স চলবে তার তালিকা (matrix এর জন্য)
  # =====================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.src.outputs.sources }}
    steps:
      - name: Decide audio sources (both / everyayah / dawateislami)
        id: src
        env:
          AUDIO_SOURCE: ${{ inputs.audio_source }}
        run: |
          case "$AUDIO_SOURCE" in
            everyayah)    echo 'sources=["everyayah"]' >> "$GITHUB_OUTPUT" ;;
            dawateislami) echo 'sources=["dawateislami"]' >> "$GITHUB_OUTPUT" ;;
            *)            echo 'sources=["everyayah","dawateislami"]' >> "$GITHUB_OUTPUT" ;;
          esac
          cat "$GITHUB_OUTPUT"

  # =====================================================================
  # Job ২: প্রতিটি সোর্সের জন্য আলাদা job (সমান্তরালে)
  # =====================================================================
  merge:
    name: Full Surah (${{ matrix.source }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.prepare.outputs.sources) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}


      # -------------------------------------------------------------
      # ইনপুট যাচাই: সূরার রেঞ্জ → তালিকা, ক্বারী ফোল্ডারের নাম
      # -------------------------------------------------------------
      - name: Normalize inputs (surah range + qari folder)
        env:
          RANGE_INPUT: ${{ inputs.surah_range }}
          AUDIO_SOURCE: ${{ matrix.source }}
          QARI_FOLDER: ${{ inputs.qari_folder }}
          DAWAT_FOLDER: ${{ inputs.dawateislami_folder }}
          AUDIO_FOLDER: ${{ inputs.audio_folder }}
          OUTPUT_FOLDER: ${{ inputs.output_folder }}
        run: |
          python3 << 'PY'
          import os, re, sys

          # ---- সূরার রেঞ্জ ----
          raw = os.environ.get("RANGE_INPUT", "").strip()
          raw = raw.translate(str.maketrans("০১২৩৪৫৬৭৮৯", "0123456789"))
          nums = set()
          for m in re.finditer(r"(\d+)\s*(?:-|–|—|to)\s*(\d+)|(\d+)", raw):
              if m.group(3):
                  nums.add(int(m.group(3)))
              else:
                  a, b = int(m.group(1)), int(m.group(2))
                  if a > b:
                      a, b = b, a
                  nums.update(range(a, b + 1))
          if not nums:
              print("Error: surah_range এ অন্তত একটি সংখ্যা দিন (যেমন: 1-114)")
              sys.exit(1)
          bad = [n for n in sorted(nums) if n < 1 or n > 114]
          if bad:
              print(f"Error: সূরার নম্বর ১ থেকে ১১৪ এর মধ্যে হতে হবে। ভুল: {bad}")
              sys.exit(1)
          with open("surah_list.txt", "w") as f:
              for n in sorted(nums):
                  f.write(f"{n:03d}\n")
          print(f"মোট {len(nums)}টি সূরা প্রসেস হবে: {sorted(nums)[:5]}{' ...' if len(nums) > 5 else ''}")

          # ---- ক্বারী ফোল্ডার ----
          source = os.environ["AUDIO_SOURCE"].strip()
          folder_in = os.environ.get("DAWAT_FOLDER", "") if source == "dawateislami" else os.environ.get("QARI_FOLDER", "")
          qari_dir = folder_in.strip().strip("/") or ("dawateislami" if source == "dawateislami" else "alafasy")
          if not re.fullmatch(r"[A-Za-z0-9._-]+", qari_dir) or qari_dir in (".", ".."):
              print("Error: ক্বারী ফোল্ডারের নামে শুধু ইংরেজি অক্ষর, সংখ্যা, '.', '_' ও '-' চলবে")
              sys.exit(1)

          def clean_root(v, default):
              v = (v or "").strip().strip("/") or default
              if not re.fullmatch(r"[A-Za-z0-9._/-]+", v) or ".." in v:
                  print(f"Error: ফোল্ডারের নাম ঠিক নয়: {v}")
                  sys.exit(1)
              return v

          audio_root = clean_root(os.environ.get("AUDIO_FOLDER"), "rizwanaudio")
          out_root = clean_root(os.environ.get("OUTPUT_FOLDER"), "rizwanFullSurah")
          print(f"Source: {source} | Qari folder: {qari_dir} | Input: {audio_root}/{qari_dir} | Output: {out_root}/{qari_dir}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"QARI_DIR={qari_dir}\n")
              f.write(f"IN_ROOT={audio_root}\n")
              f.write(f"OUT_ROOT={out_root}\n")
          PY


      - name: Install FFmpeg + mutagen
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install mutagen


      # দুই job একসাথে push করলে conflict এড়াতে retry সহায়ক (.gitattributes এ LFS লাইন merge=union)
      - name: Prepare push helper (parallel push retry)
        run: |
          cat > "$RUNNER_TEMP/push_retry.sh" << 'SH'
          push_retry() {
            for i in 1 2 3 4 5 6; do
              git pull --rebase origin "$BRANCH" || git rebase --abort || true
              if git push; then
                return 0
              fi
              echo "push failed (attempt $i) - retrying"
              sleep $(( (RANDOM % 8) + 3 ))
            done
            return 1
          }
          SH
          echo ".gitattributes merge=union" >> .git/info/attributes

          # ID3 ট্যাগ বসানোর স্ক্রিপ্ট (আগের Step 3 এর মতোই)
          cat > "$RUNNER_TEMP/tag.py" << 'PY'
          import sys
          from mutagen.mp3 import MP3
          from mutagen.id3 import ID3, TIT2, TPE1, TALB, TPE2, TCOM, TCON, COMM, ID3NoHeaderError

          path, meta = sys.argv[1], sys.argv[2]
          try:
              audio = MP3(path, ID3=ID3)
          except ID3NoHeaderError:
              audio = MP3(path)
              audio.add_tags()
          if audio.tags is None:
              audio.add_tags()
          audio.tags.clear()
          audio.tags.add(TIT2(encoding=3, text=meta))
          audio.tags.add(TPE1(encoding=3, text=meta))
          audio.tags.add(TALB(encoding=3, text=meta))
          audio.tags.add(TPE2(encoding=3, text=meta))
          audio.tags.add(TCOM(encoding=3, text=meta))
          audio.tags.add(TCON(encoding=3, text=meta))
          audio.tags.add(COMM(encoding=3, lang='eng', desc='', text=meta))
          audio.tags.save(path, v1=2, v2_version=3)
          PY


      # -------------------------------------------------------------
      # প্রতিটি সূরা: আয়াতের অডিও জোড়া → ট্যাগ → commit
      # -------------------------------------------------------------
      - name: Merge ayah audios into full surah MP3 (+ tags + commit)
        env:
          METADATA_VALUE: ${{ inputs.metadata_value }}
          COMMIT_RESULT: ${{ inputs.commit_result }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          source "$RUNNER_TEMP/push_retry.sh"

          LIMIT=104857600          # GitHub এর সীমা: 100 MiB
          OUT_DIR="${OUT_ROOT}/${QARI_DIR}"
          STAGE="full_stage"
          mkdir -p "$OUT_DIR" "$STAGE"

          made=0; skipped=0; since_push=0

          while read -r PAD <&3; do
            SRC_DIR="${IN_ROOT}/${QARI_DIR}/${PAD}"
            OUT="${OUT_DIR}/${PAD}.mp3"

            if [ ! -d "$SRC_DIR" ]; then
              echo "::warning::সূরা ${PAD}: ফোল্ডার পাওয়া যায়নি ($SRC_DIR) — বাদ"
              skipped=$((skipped+1))
              continue
            fi

            # NNN.mp3 ফাইলগুলো (000 = বিসমিল্লাহ, থাকলে সবার আগে আসে; shell glob নামের ক্রমে সাজায়)
            LIST="list_${PAD}.txt"
            : > "$LIST"
            count=0
            for f in "$SRC_DIR"/[0-9][0-9][0-9].mp3; do
              [ -e "$f" ] || continue
              printf "file '%s'\n" "$(readlink -f "$f")" >> "$LIST"
              count=$((count+1))
            done

            if [ "$count" -eq 0 ]; then
              echo "::warning::সূরা ${PAD}: কোনো আয়াতের mp3 নেই — বাদ"
              rm -f "$LIST"
              skipped=$((skipped+1))
              continue
            fi

            echo "সূরা ${PAD}: ${count}টি ফাইল জোড়া হচ্ছে -> $OUT"
            # একই ফরম্যাটে নতুন করে এনকোড (ID3 ট্যাগ/ফ্রেম সীমানার গ্লিচ এড়াতে)
            ffmpeg -nostdin -y -hide_banner -loglevel error \
              -f concat -safe 0 -i "$LIST" \
              -vn -map_metadata -1 \
              -c:a libmp3lame -b:a 128k -ar 44100 -ac 2 \
              "$OUT"
            rm -f "$LIST"

            if [ ! -s "$OUT" ]; then
              echo "Error: সূরা ${PAD} এর আউটপুট তৈরি হয়নি"
              exit 1
            fi

            python3 "$RUNNER_TEMP/tag.py" "$OUT" "$METADATA_VALUE"
            cp "$OUT" "$STAGE/${PAD}.mp3"

            SIZE=$(stat -c%s "$OUT")
            echo "সূরা ${PAD} তৈরি: $(( SIZE / 1024 / 1024 )) MiB | ট্যাগ=${METADATA_VALUE}"
            made=$((made+1))

            if [ "$COMMIT_RESULT" = "true" ]; then
              if [ "$SIZE" -gt "$LIMIT" ]; then
                echo "  ফাইল 100 MiB এর বেশি -> Git LFS"
                git lfs install --local
                git lfs track "$OUT"
                git add .gitattributes
              fi
              git add -f "$OUT"
              git commit -m "Full Surah ${PAD} MP3 (${QARI_DIR})" || echo "No changes"
              since_push=$((since_push+1))
              # ১০টি সূরা পরপর push (একবারে অনেক বড় push এড়াতে)
              if [ "$since_push" -ge 10 ]; then
                push_retry || echo "::warning::Push failed - Artifact থেকে ফাইল নিন"
                since_push=0
              fi
            fi
          done 3< surah_list.txt

          if [ "$COMMIT_RESULT" = "true" ] && [ "$since_push" -gt 0 ]; then
            push_retry || echo "::warning::Push failed - Artifact থেকে ফাইল নিন"
          fi

          echo "সম্পন্ন: তৈরি $made | বাদ $skipped"
          if [ "$made" -eq 0 ]; then
            echo "Error: কোনো সূরাই তৈরি হয়নি (${IN_ROOT}/${QARI_DIR}/ এ অডিও আছে কিনা দেখুন)"
            exit 1
          fi
          ls -lh "$STAGE"/ | head -n 130


      - name: Upload Artifact (শুধু এই রানে তৈরি সূরাগুলো)
        uses: actions/upload-artifact@v4
        with:
          name: rizwanFullSurah-${{ matrix.source }}-${{ env.QARI_DIR }}
          path: full_stage/
          retention-days: 7
