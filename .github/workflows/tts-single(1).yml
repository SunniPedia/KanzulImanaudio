name: Generate audio (Cartesia TTS)

on:
  push:
    paths:
      - "sura/*.json"
  workflow_dispatch:
    inputs:
      sura:
        description: "Sura file number, e.g. 056 (blank = all files in sura/)"
        required: false
        default: ""
      force:
        description: "Regenerate even if mp3 already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tts-audio
  cancel-in-progress: false

env:
  CARTESIA_MODEL: sonic-3.6
  CARTESIA_VERSION: "2026-08-14"
  CARTESIA_LANGUAGE: bn
  TTS_SPEED: "0.9"
  TTS_VOLUME: "1.8"
  TTS_EMOTION: neutral

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick files to process
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.sura }}" ]; then
              echo "files=sura/${{ inputs.sura }}.json" >> "$GITHUB_OUTPUT"
            else
              echo "files=$(ls sura/*.json | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'sura/*.json' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate mp3 (sura/056.json -> Audio/bangla/056/000.mp3 ...)
        if: steps.pick.outputs.files != ''
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_ID: ${{ vars.CARTESIA_VOICE_ID || secrets.CARTESIA_VOICE_ID }}
          FILES: ${{ steps.pick.outputs.files }}
          FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request, urllib.error

          API_URL = "https://api.cartesia.ai/tts/bytes"
          KEY = os.environ.get("CARTESIA_API_KEY", "").strip()
          VOICE = os.environ.get("CARTESIA_VOICE_ID", "").strip()
          if not KEY:
              raise SystemExit("CARTESIA_API_KEY is empty - add it under Settings > Secrets and variables > Actions > Secrets")
          if not VOICE:
              raise SystemExit("CARTESIA_VOICE_ID is empty - add it under Settings > Secrets and variables > Actions (Variables or Secrets tab, repository level)")
          FORCE = os.environ.get("FORCE") == "true"
          BN = str.maketrans("০১২৩৪৫৬৭৮৯", "0123456789")

          def tts(text):
              body = {
                  "model_id": os.environ["CARTESIA_MODEL"],
                  "transcript": text,
                  "voice": {"id": VOICE},
                  "language": os.environ["CARTESIA_LANGUAGE"],
                  "generation_config": {
                      "speed": float(os.environ["TTS_SPEED"]),
                      "volume": float(os.environ["TTS_VOLUME"]),
                      "emotion": os.environ["TTS_EMOTION"],
                  },
                  "output_format": {"container": "mp3", "sample_rate": 44100, "bit_rate": 128000},
              }
              req = urllib.request.Request(
                  API_URL,
                  data=json.dumps(body).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + KEY,
                      "Cartesia-Version": os.environ["CARTESIA_VERSION"],
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              for attempt in range(1, 6):
                  try:
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      msg = e.read().decode("utf-8", "replace")[:300]
                      if e.code in (429, 500, 502, 503, 504) and attempt < 5:
                          time.sleep(2 ** attempt)
                          continue
                      raise SystemExit(f"HTTP {e.code}: {msg}")
                  except urllib.error.URLError as e:
                      if attempt < 5:
                          time.sleep(2 ** attempt)
                          continue
                      raise SystemExit(f"Network error: {e}")

          for f in os.environ["FILES"].split():
              src = pathlib.Path(f)
              out_dir = pathlib.Path("Audio") / "bangla" / src.stem
              out_dir.mkdir(parents=True, exist_ok=True)
              done = skipped = 0
              for item in json.loads(src.read_text(encoding="utf-8")):
                  verse = int(str(item["verses"]).translate(BN))
                  out = out_dir / f"{verse:03d}.mp3"
                  if out.exists() and not FORCE:
                      skipped += 1
                      continue
                  print(f"{src.name} verse {verse:03d} -> {out}", flush=True)
                  out.write_bytes(tts(item["name"].strip()))
                  done += 1
                  time.sleep(0.3)
              print(f"{src.stem}: generated {done}, skipped {skipped}")
          PY

      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Audio
          if git diff --cached --quiet; then
            echo "No new audio."
          else
            git commit -m "chore: generate audio"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
