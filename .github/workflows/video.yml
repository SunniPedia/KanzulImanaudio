name: Image + Audio to Surah Video

on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'কোন সুরার ভিডিও বানাবে? (যেমন: 001, 002)'
        required: true
        default: '001'
        type: string
      image_folder:
        description: 'Image folder'
        required: false
        default: 'img'
        type: string
      audio_folder:
        description: 'Audio folder (rizwanaudio / Audio/bangla)'
        required: false
        default: 'rizwanaudio'
        type: string

jobs:
  make-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Make Ayat Videos and Merge to One Surah Video
        run: |
          IMG_DIR="${{ inputs.image_folder }}"
          AUDIO_DIR="${{ inputs.audio_folder }}"
          SURAH="${{ inputs.surah_number }}"

          TEMP_VIDEO_DIR="temp_${SURAH}_videos"
          FINAL_DIR="rizwanSurahVideo"

          mkdir -p "$TEMP_VIDEO_DIR"
          mkdir -p "$FINAL_DIR"

          # 1. প্রতিটা আয়াতের জন্য আলাদা ভিডিও বানাও
          for img_file in "$IMG_DIR"/${SURAH}*.jpg; do
            [ -e "$img_file" ] || continue
            base=$(basename "$img_file".jpg) # 001001
            audio_file="$AUDIO_DIR/$base.mp3"

            if [ -f "$audio_file" ]; then
              echo "Creating video for $base"
              ffmpeg -y -hide_banner -loglevel error \
                -loop 1 -i "$img_file" \
                -i "$audio_file" \
                -c:v libx264 -tune stillimage \
                -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,setsar=1,fps=30" \
                -c:a aac -b:a 192k \
                -pix_fmt yuv420p -shortest \
                "$TEMP_VIDEO_DIR/$base.mp4"
            else
              echo "Audio not found for $base, skipping"
            fi
          done

          # 2. সব আয়াতের ভিডিও গুলো একসাথে করে ফুল সুরা বানাও
          ls -1 $TEMP_VIDEO_DIR/${SURAH}*.mp4 | sort -V > video_list_raw.txt

          if [! -s video_list_raw.txt ]; then
            echo "No videos created for Surah $SURAH"
            exit 1
          fi

          rm -f concat_videos.txt
          while read f; do
            echo "file '$PWD/$f'" >> concat_videos.txt
          done < video_list_raw.txt

          ffmpeg -y -f concat -safe 0 -i concat_videos.txt -c copy "$FINAL_DIR/${SURAH}.mp4"

          ls -lh "$FINAL_DIR"/
          rm -rf "$TEMP_VIDEO_DIR" concat_videos.txt video_list_raw.txt

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: Surah-${{ inputs.surah_number }}-Video
          path: rizwanSurahVideo/

      - name: Commit Video to Repo (Optional)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f rizwanSurahVideo/
          # বড় ফাইলের জন্য LFS লাগতে পারে, 100MB এর বেশি হলে কমিট ফেইল করবে
          git commit -m "Added Surah ${{ inputs.surah_number }} Video" || echo "No changes"
          git push || echo "Push failed - file might be >100MB, download from Artifact"
